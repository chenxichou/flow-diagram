}
function closeExportMenu() { const m = document.getElementById('exportMenu'); if (m) m.classList.remove('show'); }

// ---- 自包含 GIF89a 编码器（无依赖）----
function encodeGIF(width, height, frames, palette, delayCs) {
  const numColors = palette.length;
  let gctBits = 0;
  while ((1 << gctBits) < numColors) gctBits++;
  if (gctBits > 8) gctBits = 8;
  const gctSize = 1 << gctBits;
  const gctField = (gctBits - 1) & 0x07;
  const out = [];
  out.push(0x47, 0x49, 0x46, 0x38, 0x39, 0x61); // GIF89a
  out.push(width & 0xff, (width >> 8) & 0xff);
  out.push(height & 0xff, (height >> 8) & 0xff);
  out.push(0x80 | gctField | (gctField << 4));
  out.push(0x00); out.push(0x00);
  for (let i = 0; i < gctSize; i++) {
    const c = palette[i] || [0, 0, 0];
    out.push(c[0] & 0xff, c[1] & 0xff, c[2] & 0xff);
  }
  out.push(0x21, 0xff, 0x0b);
  'NETSCAPE2.0'.split('').forEach(ch => out.push(ch.charCodeAt(0)));
  out.push(0x03, 0x01, 0x00, 0x00, 0x00);
  frames.forEach(idx => {
    out.push(0x21, 0xf9, 0x04, 0x00);
    out.push(delayCs & 0xff, (delayCs >> 8) & 0xff);
    out.push(0x00, 0x00);
    out.push(0x2c);
    out.push(0x00, 0x00, 0x00, 0x00);
    out.push(width & 0xff, (width >> 8) & 0xff);
    out.push(height & 0xff, (height >> 8) & 0xff);
    out.push(0x00);
    const minCodeSize = gctBits < 2 ? 2 : gctBits;
    out.push(minCodeSize);
    const lzw = lzwEncode(minCodeSize, idx);
    let p = 0;
    while (p < lzw.length) {
      const n = Math.min(255, lzw.length - p);
      out.push(n);
      for (let i = 0; i < n; i++) out.push(lzw[p + i]);
      p += n;
    }
    out.push(0x00);
  });
  out.push(0x3b);
  return Uint8Array.from(out);
}
function lzwEncode(minCodeSize, indices) {
  const clearCode = 1 << minCodeSize;
  const eoiCode = clearCode + 1;
  let codeSize = minCodeSize + 1;
  let dict = new Map();
  let next;
  function reset() { dict = new Map(); next = eoiCode + 1; codeSize = minCodeSize + 1; }
  const out = [];
  let bitBuf = 0, bitCount = 0;
  function emit(code) {
    bitBuf |= (code << bitCount);
    bitCount += codeSize;
    while (bitCount >= 8) { out.push(bitBuf & 0xff); bitBuf = (bitBuf >>> 8); bitCount -= 8; }
  }
  reset(); emit(clearCode);
  let prefix = indices[0];
  for (let i = 1; i < indices.length; i++) {
    const k = indices[i];
    const key = (prefix << 8) | k;
    if (dict.has(key)) { prefix = dict.get(key); }
    else {
      emit(prefix);
      if (next === (1 << codeSize) && codeSize < 12) codeSize++;
      dict.set(key, next); next++;
      if (next === 4096) { emit(clearCode); reset(); }
      prefix = k;
    }
  }
  emit(prefix); emit(eoiCode);
  if (bitCount > 0) out.push(bitBuf & 0xff);
  return out;
}

// 8x8x4 = 256 色立方调色板
function buildCubePalette() {
  const pal = [];
  for (let rq = 0; rq < 8; rq++) for (let gq = 0; gq < 8; gq++) for (let bq = 0; bq < 4; bq++)
    pal.push([Math.round(rq / 7 * 255), Math.round(gq / 7 * 255), Math.round(bq / 3 * 255)]);
  return pal;
}
function quantRgb(r, g, b) {
  const rq = Math.min(7, Math.round(r / 255 * 7));
  const gq = Math.min(7, Math.round(g / 255 * 7));
  const bq = Math.min(3, Math.round(b / 255 * 3));
  return rq * 32 + gq * 4 + bq;
}

// 把当前 <style> 全部内联进 SVG（含 :root 计算变量），保证序列化后自包含
function embedSvgStyle() {
  const cs = getComputedStyle(document.documentElement);
  const names = [];
  for (let i = 0; i < cs.length; i++) { const p = cs[i]; if (p.startsWith('--')) names.push(p); }
  let rootVars = ':root{';
  names.forEach(n => { rootVars += n + ':' + cs.getPropertyValue(n).trim() + ';'; });
  rootVars += '}';
  let css = '';
  document.querySelectorAll('style').forEach(s => { css += s.textContent + '\n'; });
  return '<style>' + rootVars + '\n' + css + '</style>';
}

// 采样 flow 在相位 phase 处的粒子，画入克隆粒子层
function paintExportParticles(cloneParticlesLayer, phase) {
  const tab = getTab();
  (tab.flows || []).forEach((f, idx) => {
    const mp = document.getElementById('mp-' + f.id);
    if (!mp) return;
    let len = 0; try { len = mp.getTotalLength(); } catch (e) { len = 0; }
    if (!len) return;
    const color = resolveColor(f.color);
    const per = 2;
    for (let k = 0; k < per; k++) {
      let pos = (((phase + idx * 0.13 + k * 0.5) % 1) + 1) % 1;
      let pt; try { pt = mp.getPointAtLength(pos * len); } catch (e) { continue; }
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y); c.setAttribute('r', 4);
      c.setAttribute('fill', color);
      cloneParticlesLayer.appendChild(c);
    }
  });
}

// 克隆主画布为自包含 SVG 字符串；phase=null 时不画粒子
function buildExportSvg(phase) {
  const clone = svg.cloneNode(true);
  clone.removeAttribute('id');
  const pl = clone.querySelector('#particlesLayer');
  if (pl) { pl.innerHTML = ''; if (phase !== null) paintExportParticles(pl, phase); }
  const vb = (svg.getAttribute('viewBox') || '0 0 1200 560').split(/\s+/).map(Number);
  const W = vb[2], H = vb[3];
  clone.setAttribute('width', W);
  clone.setAttribute('height', H);
  clone.setAttribute('overflow', 'visible');
  clone.setAttribute('style', 'width:' + W + 'px;height:' + H + 'px');
  let str = new XMLSerializer().serializeToString(clone);
  if (!/xmlns="http:\/\/www\.w3\.org\/2000\/svg"/.test(str)) str = str.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"', 1);
  str = str.replace(/>/, '>' + embedSvgStyle(), 1);
  return { str, W, H };
}

// SVG 字符串 -> ImageData（按 scale 放大），填充主题背景色
function rasterizeSvg(svgStr, W, H, scale) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const bg = (getComputedStyle(document.documentElement).getPropertyValue('--bg-deep') || '#eef2f7').trim();
    img.onload = () => {
      const cw = Math.max(1, Math.round(W * scale)), ch = Math.max(1, Math.round(H * scale));
      const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      resolve(cv.getContext('2d').getImageData(0, 0, cw, ch));
    };
    img.onerror = (e) => reject(e);
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  });
}

async function exportImage() {
  const wasOn = state.animationOn;
  if (!wasOn) { state.animationOn = true; render(); }
  try {
    const { str, W, H } = buildExportSvg(0.3);
    const img = await rasterizeSvg(str, W, H, 2);
    const cv = document.createElement('canvas'); cv.width = img.width; cv.height = img.height;
    cv.getContext('2d').putImageData(img, 0, 0);
    cv.toBlob((b) => { if (b) { downloadBlob('flow-diagram.png', b); showToast('图片已导出 (PNG)'); } }, 'image/png');
  } catch (e) {
    showToast('导出图片失败：' + (e && e.message ? e.message : e));
  } finally {
    if (!wasOn) { state.animationOn = false; render(); }
    closeExportMenu();
  }
}

async function exportGIF() {
  showToast('正在生成动图…');
  const wasOn = state.animationOn;
  if (!wasOn) { state.animationOn = true; render(); }
  const vb = (svg.getAttribute('viewBox') || '0 0 1200 560').split(/\s+/).map(Number);
  const W = vb[2], H = vb[3];
  const scale = Math.min(1, 900 / W);
  const F = 24, delay = 60;
  const palette = buildCubePalette();
  const frames = [];
  try {
    for (let i = 0; i < F; i++) {
      const phase = i / F;
      const { str } = buildExportSvg(phase);
      const img = await rasterizeSvg(str, W, H, scale);
      const data = img.data;
      const n = data.length / 4;
      const idx = new Uint8Array(n);
      for (let p = 0; p < n; p++) {
        const o = p * 4;
        idx[p] = quantRgb(data[o], data[o + 1], data[o + 2]);
      }
      frames.push(idx);
    }
    const gif = encodeGIF(Math.round(W * scale), Math.round(H * scale), frames, palette, delay);
    downloadBlob('flow-diagram.gif', new Blob([gif], { type: 'image/gif' }));
    showToast('动图已导出 (GIF)');
  } catch (e) {
    showToast('导出动图失败：' + (e && e.message ? e.message : e));
  } finally {
    if (!wasOn) { state.animationOn = false; render(); }
    closeExportMenu();
  }
}

// ============================================================
// Mouse / Drag / Keyboard
// ============================================================
let dragging = null;
let dragOffset = { x: 0, y: 0 };
let pendingDragUndo = false;        // 拖拽/缩放：首次实际移动时才记一次撤销
let draggingZone = null;
let dragZoneOffset = { x: 0, y: 0 };
let draggingHLine = null;
let dragHLineOffset = 0;
let resizingZone = null;              // 正在缩放的区域 id
let resizingNode = null;             // 正在缩放的节点 id
let resizeSide = '';                  // 控制点方向 n/s/w/e/nw/ne/sw/se
let resizeStart = { x: 0, y: 0, ox: 0, oy: 0, ow: 0, oh: 0 };

const svg = document.getElementById('mainSvg');

function getSVGPoint(evt) {
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX;
  pt.y = evt.clientY;
  const ctm = svg.getScreenCTM();
  if (!ctm) return { x: 0, y: 0 };
  const transformed = pt.matrixTransform(ctm.inverse());
  return { x: transformed.x, y: transformed.y };
}

// 画布整体缩放：通过缩放 SVG 渲染宽度（viewBox 不变，坐标/连线逻辑不受影响），
// 使过高的区域可整体缩小以完整显示在屏幕内；放大时画布容器出现滚动条可平移查看
let canvasZoom = 1;
const ZOOM_MIN = 0.2, ZOOM_MAX = 3;
function applyZoom() {
  canvasZoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, canvasZoom));
  svg.style.width = (100 * canvasZoom) + '%';
  // 缩小时允许画布高度小于容器，从而整体可见；100% 时恢复填满（沿用 CSS min-height:100%）
  svg.style.minHeight = (canvasZoom === 1) ? '' : 'auto';
  const lbl = document.getElementById('zoomLabel');
  if (lbl) lbl.textContent = Math.round(canvasZoom * 100) + '%';
}
function zoomIn() { canvasZoom += 0.1; applyZoom(); }
function zoomOut() { canvasZoom -= 0.1; applyZoom(); }
function zoomReset() { canvasZoom = 1; applyZoom(); }
// Ctrl/⌘ + 滚轮缩放画布（普通滚轮仍用于滚动超高内容）
const canvasScrollEl = document.getElementById('canvasScroll');
if (canvasScrollEl) {
  canvasScrollEl.addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      canvasZoom *= (e.deltaY < 0 ? 1.1 : 1 / 1.1);
      applyZoom();
    }
  }, { passive: false });
}

svg.addEventListener('mousedown', (e) => {
  const target = e.target;
  const dataType = target.getAttribute('data-type');

  if (state.connectMode) {
    const dt = target.getAttribute('data-type');
    let id = null, side = null;
    if (dt === 'node-anchor') { id = target.getAttribute('data-id'); side = target.getAttribute('data-side'); }
    else id = findNodeIdFromTarget(target);
    if (id) { completeConnect(id, side || undefined); return; }
    return;
  }

  if (dataType === 'node-anchor') {
    // 点击节点某边锚点 → 从该方向开始连线
    const id = target.getAttribute('data-id');
    const side = target.getAttribute('data-side');
    state.selectedId = id;
    state.selectedType = 'node';
    render();
    startConnect(id, side);
    showToast('从' + ({top:'上',bottom:'下',left:'左',right:'右'})[side] + '侧连线：点击目标节点完成，ESC 取消');
    return;
  }

  if (dataType === 'node' || dataType === 'node-text' || dataType === 'flow') {
    const id = target.getAttribute('data-id');
    const type = dataType === 'flow' ? 'flow' : 'node';
    state.selectedId = id;
    state.selectedType = type;
    render();
    if (type === 'node') {
      const tab = getTab();
      const node = tab.nodes.find(n => n.id === id);
      if (node) {
        const pt = getSVGPoint(e);
        dragging = id;
        pendingDragUndo = true;
        dragOffset = { x: pt.x - node.x, y: pt.y - node.y };
      }
    }
  } else if (dataType === 'zone-resize') {
    // 点击区域缩放控制点 → 进入缩放模式（按方向调整区域尺寸）
    const id = target.getAttribute('data-id');
    const side = target.getAttribute('data-side');
    state.selectedId = id;
    state.selectedType = 'zone';
    const tab = getTab();
    const zone = (tab.zones || []).find(z => z.id === id);
    if (zone) {
      const pt = getSVGPoint(e);
      resizingZone = id;
      pendingDragUndo = true;
      resizeSide = side;
      resizeStart = { x: pt.x, y: pt.y, ox: zone.x, oy: zone.y, ow: zone.w, oh: zone.h };
    }
  } else if (dataType === 'node-resize') {
    // 点击节点缩放控制点 → 进入缩放模式（按方向调整节点尺寸）
    const id = target.getAttribute('data-id');
    const side = target.getAttribute('data-side');
    state.selectedId = id;
    state.selectedType = 'node';
    const tab = getTab();
    const node = (tab.nodes || []).find(n => n.id === id);
    if (node) {
      const pt = getSVGPoint(e);
      resizingNode = id;
      pendingDragUndo = true;
      resizeSide = side;
      resizeStart = { x: pt.x, y: pt.y, ox: node.x, oy: node.y, ow: node.w, oh: node.h };
    }
  } else if (dataType === 'zone') {
    const id = target.getAttribute('data-id');
    const additive = e.ctrlKey || e.metaKey || e.shiftKey;
    const sel = state.selectedZones || (state.selectedZones = []);
    if (additive) {
      const idx = sel.indexOf(id);
      if (idx >= 0) sel.splice(idx, 1); else sel.push(id);
      if (sel.length === 0) { state.selectedId = null; state.selectedType = null; }
      else { state.selectedId = id; state.selectedType = 'zone'; }
    } else {
      state.selectedZones = [id];
      state.selectedId = id; state.selectedType = 'zone';
    }
    render();
    const tab = getTab();
    const zone = (tab.zones || []).find(z => z.id === id);
    if (zone && state.selectedType === 'zone') {
      const pt = getSVGPoint(e);
      draggingZone = id;
      pendingDragUndo = true;
      dragZoneOffset = { x: pt.x - zone.x, y: pt.y - zone.y };
    }
  } else if (dataType === 'hline' || dataType === 'hline-label') {
    const id = target.getAttribute('data-id');
    state.selectedId = id;
    state.selectedType = 'hline';
    render();
    if (dataType === 'hline') {
      const tab = getTab();
      const h = (tab.hlines || []).find(x => x.id === id);
      if (h) {
        const pt = getSVGPoint(e);
        draggingHLine = id;
        pendingDragUndo = true;
        dragHLineOffset = pt.y - h.y;
      }
    }
  } else {
    state.selectedId = null;
    state.selectedType = null;
    state.selectedZones = [];
    render();
  }
});

function findNodeIdFromTarget(target) {
  let el = target;
  while (el && el !== svg) {
    const did = el.getAttribute && el.getAttribute('data-id');
    const dt = el.getAttribute && el.getAttribute('data-type');
    if (did && dt === 'node') return did;
    if (did && dt === 'node-text') return did;
    el = el.parentElement;
  }
  return null;
}

// 轻量同步单个节点的 SVG 元素（不重建面板，避免输入框失焦；形状元素类型不变，仅更新几何/文本）
function syncNodeSvg(node) {
  const g = svg.querySelector(`g[data-id="${node.id}"]`);
  if (!g) return;
  const sh = nodeShape(node);
  const shapeEl = g.querySelector('[data-shape]');
  if (shapeEl) {
    for (const [k, v] of Object.entries(sh.attrs)) shapeEl.setAttribute(k, v);
  }
  const texts = g.querySelectorAll('text');
  if (texts[0]) {
    texts[0].textContent = node.name;
    texts[0].setAttribute('x', node.x + node.w/2);
    texts[0].setAttribute('y', nodeTextY(node, 0));
  }
  if (texts[1]) {
    texts[1].textContent = formatSys(node.sys);
    texts[1].setAttribute('x', node.x + node.w/2);
    texts[1].setAttribute('y', nodeTextY(node, 1));
  }
  // 超链接角标跟随节点移动
  const badge = g.querySelector('[data-type="node-link-badge"]');
  if (badge) {
    const br = badge.querySelector('rect');
    const bt = badge.querySelector('text');
    if (br) { br.setAttribute('x', node.x + node.w - 18); br.setAttribute('y', node.y + 2); }
    if (bt) { bt.setAttribute('x', node.x + node.w - 10); bt.setAttribute('y', node.y + 11); }
  }
  // 四向锚点跟随节点移动（锚点在独立 anchorsLayer）
  const anchors = svg.querySelectorAll(`#anchorsLayer .svg-node-anchor[data-id="${node.id}"]`);
  if (anchors.length >= 4) {
    const acx = node.x + node.w/2, acy = node.y + node.h/2;
    const pts = [[acx, node.y], [acx, node.y + node.h], [node.x, acy], [node.x + node.w, acy]];
    anchors.forEach((a, i) => { a.setAttribute('cx', pts[i][0]); a.setAttribute('cy', pts[i][1]); });
  }
}

svg.addEventListener('mousemove', (e) => {
  const pt = getSVGPoint(e);

  if (state.connectMode && state.connectFrom) {
    const tab = getTab();
    const fromNode = tab.nodes.find(n => n.id === state.connectFrom);
    if (fromNode) {
      const tempLine = document.getElementById('tempLine');
      tempLine.style.display = 'block';
      const sp = state.connectFromSide ? anchorPoint(fromNode, state.connectFromSide) : { x: fromNode.x + fromNode.w/2, y: fromNode.y + fromNode.h/2 };
      tempLine.setAttribute('x1', sp.x);
      tempLine.setAttribute('y1', sp.y);
      tempLine.setAttribute('x2', pt.x);
      tempLine.setAttribute('y2', pt.y);
    }
  }

  if (dragging) {
    if (pendingDragUndo) { pushUndo(); pendingDragUndo = false; }
    const tab = getTab();
    const node = tab.nodes.find(n => n.id === dragging);
    if (node) {
      node.x = Math.round(pt.x - dragOffset.x);
      node.y = Math.round(pt.y - dragOffset.y);
      syncNodeSvg(node);
      renderFlows(tab);
      renderParticles(tab);
      const inputs = document.querySelectorAll('.form-input[type="number"]');
      if (inputs[0]) inputs[0].value = node.x;
      if (inputs[1]) inputs[1].value = node.y;
    }
  }

  if (draggingZone) {
    if (pendingDragUndo) { pushUndo(); pendingDragUndo = false; }
    const tab = getTab();
    const zone = (tab.zones || []).find(z => z.id === draggingZone);
    if (zone) {
      const nx = Math.round(pt.x - dragZoneOffset.x);
      const ny = Math.round(pt.y - dragZoneOffset.y);
      const dx = nx - zone.x, dy = ny - zone.y;
      zone.x = nx;
      zone.y = ny;
      // 区域移动时，同步移动区域内子节点
      if (dx || dy) {
        for (const n of (tab.nodes || [])) {
          if (n.zone === zone.id) { n.x += dx; n.y += dy; syncNodeSvg(n); }
        }
        renderFlows(tab);
        renderParticles(tab);
      }
      const zr = svg.querySelector(`rect[data-id="${draggingZone}"][data-type="zone"]`);
      if (zr) { zr.setAttribute('x', zone.x); zr.setAttribute('y', zone.y); }
      const zl = svg.querySelector(`text[data-id="${draggingZone}"][data-type="zone-label"]`);
      if (zl) { zl.setAttribute('x', zone.x + zone.w/2); zl.setAttribute('y', zone.y + 22); }
      const zinputs = document.querySelectorAll('.form-input[type="number"]');
      if (zinputs[0]) zinputs[0].value = zone.x;
      if (zinputs[1]) zinputs[1].value = zone.y;
    }
  }

  if (resizingZone) {
    if (pendingDragUndo) { pushUndo(); pendingDragUndo = false; }
    const tab = getTab();
    const zone = (tab.zones || []).find(z => z.id === resizingZone);
    if (zone) {
      const dx = pt.x - resizeStart.x, dy = pt.y - resizeStart.y;
      const g = zoneResizeGeom(zone, resizeSide, dx, dy, resizeStart);
      zone.x = g.x; zone.y = g.y; zone.w = g.w; zone.h = g.h;
      const zr = svg.querySelector(`rect[data-id="${resizingZone}"][data-type="zone"]`);
      if (zr) { zr.setAttribute('x', zone.x); zr.setAttribute('y', zone.y); zr.setAttribute('width', zone.w); zr.setAttribute('height', zone.h); }
      const zl = svg.querySelector(`text[data-id="${resizingZone}"][data-type="zone-label"]`);
      if (zl) { zl.setAttribute('x', zone.x + zone.w/2); zl.setAttribute('y', zone.y + 22); }
      syncZoneHandles(zone);
      renderHLines(tab); // 区域变化后阶段线淡化范围实时跟随
      const zinputs = document.querySelectorAll('#propsPanel .form-input[type="number"]');
      if (zinputs[0]) zinputs[0].value = zone.x;
      if (zinputs[1]) zinputs[1].value = zone.y;
      if (zinputs[2]) zinputs[2].value = zone.w;
      if (zinputs[3]) zinputs[3].value = zone.h;
    }
  }

  if (resizingNode) {
    if (pendingDragUndo) { pushUndo(); pendingDragUndo = false; }
    const tab = getTab();
    const node = (tab.nodes || []).find(n => n.id === resizingNode);
    if (node) {
      const dx = pt.x - resizeStart.x, dy = pt.y - resizeStart.y;
      const g = nodeResizeGeom(node, resizeSide, dx, dy, resizeStart);
      node.x = g.x; node.y = g.y; node.w = g.w; node.h = g.h;
      syncNodeSvg(node);
      syncNodeHandles(node);
      renderFlows(tab);
      renderParticles(tab);
      const ninputs = document.querySelectorAll('#propsPanel .form-input[type="number"]');
      if (ninputs[0]) ninputs[0].value = node.x;
      if (ninputs[1]) ninputs[1].value = node.y;
      if (ninputs[2]) ninputs[2].value = node.w;
      if (ninputs[3]) ninputs[3].value = node.h;
    }
  }

  if (draggingHLine) {
    if (pendingDragUndo) { pushUndo(); pendingDragUndo = false; }
    const tab = getTab();
    const h = (tab.hlines || []).find(x => x.id === draggingHLine);
    if (h) {
      h.y = Math.round(pt.y - dragHLineOffset);
      const els = svg.querySelectorAll(`[data-id="${draggingHLine}"]`);
      els.forEach(el => {
        if (el.tagName === 'line') { el.setAttribute('y1', h.y); el.setAttribute('y2', h.y); }
        else if (el.tagName === 'text') { el.setAttribute('y', h.y - 7); }
      });
      const yInput = document.querySelector('#propsPanel .form-input[type="number"]');
      if (yInput) yInput.value = h.y;
    }
  }

  // 拖拽/缩放过程中实时扩展画布高度（超出当前 viewBox 时自动加高，可滚动查看）
  if (dragging || draggingZone || resizingZone || resizingNode || draggingHLine) fitViewBox();
});

svg.addEventListener('mouseup', () => {
  pendingDragUndo = false;
  if (dragging) { dragging = null; markDirty(); }
  if (draggingZone) { draggingZone = null; markDirty(); }
  if (resizingZone) { resizingZone = null; markDirty(); }
  if (resizingNode) { resizingNode = null; markDirty(); }
  if (draggingHLine) { draggingHLine = null; markDirty(); }
});

// 窗口尺寸变化时重算阶段线宽度（占满可视画布）
window.addEventListener('resize', () => {
  const tab = getTab();
  if (tab) renderHLines(tab);
});

// 方向键移动：一次连续按住/微调 = 一个撤销单位（避免逐个像素碎步撤销）
let arrowMoveSession = null; // 当前方向键移动会话归属的 node.id
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.connectMode) { exitConnectMode(); return; }
    if (state.selectedId) { state.selectedId = null; state.selectedType = null; state.selectedZones = []; render(); }
  }
  if ((e.key === 'Delete' || e.key === 'Backspace')) {
    const active = document.activeElement;
    if (active && (active.tagName === 'INPUT' || active.tagName === 'SELECT')) return;
    if (state.selectedType === 'node' && state.selectedId) deleteNode(state.selectedId);
    else if (state.selectedType === 'flow' && state.selectedId) deleteFlow(state.selectedId);
    else if (state.selectedType === 'zone' && state.selectedId) deleteZone(state.selectedId);
    else if (state.selectedType === 'hline' && state.selectedId) deleteHLine(state.selectedId);
  }
  // 方向键移动选中的节点（↑↓←→；Shift 加速 10px）
  if (state.selectedType === 'node' && state.selectedId) {
    const step = e.shiftKey ? 10 : 1;
    let dx = 0, dy = 0;
    if (e.key === 'ArrowLeft') dx = -step;
    else if (e.key === 'ArrowRight') dx = step;
    else if (e.key === 'ArrowUp') dy = -step;
    else if (e.key === 'ArrowDown') dy = step;
    else return;
    // 焦点在输入框/可编辑区时让位给原生光标移动
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
    e.preventDefault();
    const tab = getTab();
    const n = (tab.nodes || []).find(x => x.id === state.selectedId);
    if (!n) return;
    if (arrowMoveSession !== n.id) { pushUndo(); arrowMoveSession = n.id; } // 一次会话仅记一次撤销
    n.x = Math.round(n.x + dx);
    n.y = Math.round(n.y + dy);
    syncNodeSvg(n);
    renderFlows(tab);
    renderParticles(tab);
    renderNodeProps(tab);
    fitViewBox();
    markDirty();
  }
});
document.addEventListener('keyup', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) arrowMoveSession = null;
});

// Double-click to edit name
svg.addEventListener('dblclick', (e) => {
  const target = e.target;
  const dataType = target.getAttribute('data-type');
  const id = target.getAttribute('data-id');
  const tab = getTab();
  if (dataType === 'node' || dataType === 'node-text') {
    const node = tab.nodes.find(n => n.id === id);
    if (!node) return;
    // 双击节点：选中 + 展开右侧属性栏 + 直接弹文字编辑框（设置跳转的节点，跳转走右键菜单）
    state.selectedId = node.id;
    state.selectedType = 'node';
    expandPanel();
    render();
    showRenameOverlay(e, node.name, (val) => { node.name = val || '未命名'; }, { title: '编辑节点名称' });
    return;
  }
  if (dataType === 'zone' || dataType === 'zone-label') {
    const zone = (tab.zones || []).find(z => z.id === id);
    if (!zone) return;
    showRenameOverlay(e, zone.label, (val) => { zone.label = val || '新区域'; }, { title: '编辑区域名称' });
    return;
  }
  if (dataType === 'hline' || dataType === 'hline-label') {
    const h = (tab.hlines || []).find(x => x.id === id);
    if (!h) return;
    showRenameOverlay(e, h.label || '阶段', (val) => { h.label = val || '阶段'; }, { title: '编辑阶段名称' });
  }
});

function showRenameOverlay(e, value, onSave, opts) {
  opts = opts || {};
  const existing = document.querySelector('.modal-mask');
  if (existing) existing.parentNode.removeChild(existing);

  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  const box = document.createElement('div');
  box.className = 'modal-box';
  if (opts.title) {
    const title = document.createElement('div');
    title.className = 'modal-title';
    title.textContent = opts.title;
    box.appendChild(title);
  }
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'modal-input';
  input.value = value;
  box.appendChild(input);
  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const cancel = document.createElement('button');
  cancel.className = 'modal-btn';
  cancel.textContent = '取消';
  const ok = document.createElement('button');
  ok.className = 'modal-btn primary';
  ok.textContent = '确认';
  actions.appendChild(cancel);
  actions.appendChild(ok);
  box.appendChild(actions);
  mask.appendChild(box);
  document.body.appendChild(mask);

  const close = () => { if (mask.parentNode) mask.parentNode.removeChild(mask); };
  const confirm = () => {
    pushUndo();
    onSave(input.value);
    close();
    render();
  };

  ok.addEventListener('click', confirm);
  cancel.addEventListener('click', close);
  // 点击遮罩空白处关闭（不保存）
  mask.addEventListener('mousedown', (ev) => { if (ev.target === mask) close(); });
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); confirm(); }
    if (ev.key === 'Escape') { ev.preventDefault(); close(); }
  });
  input.focus();
  input.select();
}

// Right-click context menu
svg.addEventListener('contextmenu', (e) => {
  const target = e.target;
  const dataType = target.getAttribute('data-type');
  const id = target.getAttribute('data-id');
  const tab = getTab();

  if (dataType === 'zone' || dataType === 'zone-label') {
    const zone = (tab.zones || []).find(z => z.id === id);
    if (!zone) return;
    e.preventDefault();
    state.selectedId = id;
    state.selectedType = 'zone';
    render();
    const menu = document.getElementById('ctxMenu');
    const subLeft = (e.clientX > window.innerWidth * 0.62) ? ' submenu-left' : '';
    menu.innerHTML = `
      <div class="context-item has-sub${subLeft}">⊞ 节点排列（本区域）
        <div class="context-submenu">
          <div class="context-item" onclick="distributeZoneNodes('${id}'); closeCtxMenu()">▦ 均匀分布</div>
          <div class="context-item" onclick="centerZoneNodesH('${id}'); closeCtxMenu()">⊟ 水平居中</div>
          <div class="context-item" onclick="centerZoneNodesV('${id}'); closeCtxMenu()">⊤ 垂直居中</div>
        </div>
      </div>
      <div class="context-sep"></div>
      <div class="context-item" onclick="addNode(); closeCtxMenu()">⊕ 添加节点到本区域</div>
      <div class="context-item" onclick="addZone(); closeCtxMenu()">⊞ 添加区域</div>
      <div class="context-sep"></div>
      <div class="context-item danger" onclick="deleteZone('${id}'); closeCtxMenu()">🗑 删除区域</div>
    `;
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.classList.add('visible');
    return;
  }

  if (dataType === 'flow') {
    const f = (tab.flows || []).find(x => x.id === id);
    if (!f) return;
    e.preventDefault();
    state.selectedId = id;
    state.selectedType = 'flow';
    render();
    const menu = document.getElementById('ctxMenu');
    menu.innerHTML = `
      <div class="context-label">连线</div>
      <div class="context-item" onclick="editFlowNote('${id}'); closeCtxMenu()">✏ ${f.note ? '修改备注' : '添加备注'}</div>
      ${f.note ? `<div class="context-item" onclick="clearFlowNote('${id}'); closeCtxMenu()">✕ 删除备注</div>` : ''}
      <div class="context-sep"></div>
      <div class="context-item danger" onclick="deleteFlow('${id}'); closeCtxMenu()">🗑 删除连线</div>
    `;
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.classList.add('visible');
    return;
  }

  if (dataType === 'hline' || dataType === 'hline-label') {
    const h = (tab.hlines || []).find(x => x.id === id);
    if (!h) return;
    e.preventDefault();
    state.selectedId = id;
    state.selectedType = 'hline';
    render();
    const menu = document.getElementById('ctxMenu');
    menu.innerHTML = `
      <div class="context-label">阶段线</div>
      <div class="context-item danger" onclick="deleteHLine('${id}'); closeCtxMenu()">🗑 删除阶段线</div>
    `;
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.classList.add('visible');
    return;
  }

  // 画布空白处（无 data-type）右键 → 弹出“添加区域 / 添加节点”菜单（元素落在点击位置）
  if (!dataType) {
    e.preventDefault();
    const pt = getSVGPoint(e);
    const menu = document.getElementById('ctxMenu');
    menu.innerHTML = `
      <div class="context-label">添加</div>
      <div class="context-item" onclick="addZone(${pt.x}, ${pt.y}); closeCtxMenu()">⊞ 添加区域</div>
      <div class="context-item" onclick="addNode(${pt.x}, ${pt.y}); closeCtxMenu()">⊕ 添加节点</div>
    `;
    menu.style.left = e.clientX + 'px';
    menu.style.top = e.clientY + 'px';
    menu.classList.add('visible');
    return;
  }

  if (dataType !== 'node' && dataType !== 'node-text') { e.preventDefault(); return; }
  e.preventDefault();
  const node = tab.nodes.find(n => n.id === id);
  if (!node) return;

  state.selectedId = id;
  state.selectedType = 'node';
  render();

  const menu = document.getElementById('ctxMenu');
  const linkTabObj = node.linkTab ? state.tabs.find(t => t.id === node.linkTab) : null;
  menu.innerHTML = `
    ${linkTabObj ? `<div class="context-item" onclick="jumpToLinkTab('${id}'); closeCtxMenu()">⤴ 跳转至「${escapeHtml(linkTabObj.label)}」</div>` : ''}
    ${linkTabObj ? '<div class="context-sep"></div>' : ''}
    <div class="context-item" onclick="startConnect('${id}'); closeCtxMenu()">↗ 从此节点连线</div>
    <div class="context-sep"></div>
    <div class="context-label">形状</div>
    <div class="context-shapes">
      <span class="ctx-shape ${(node.shape||'rect')==='rect'?'on':''}" title="矩形" onclick="setNodeShape('${id}','rect'); closeCtxMenu()">▭</span>
      <span class="ctx-shape ${(node.shape||'rect')==='rhombus'?'on':''}" title="菱形 · 审批" onclick="setNodeShape('${id}','rhombus'); closeCtxMenu()">◆</span>
      <span class="ctx-shape ${(node.shape||'rect')==='circle'?'on':''}" title="圆形" onclick="setNodeShape('${id}','circle'); closeCtxMenu()">●</span>
      <span class="ctx-shape ${(node.shape||'rect')==='hexagon'?'on':''}" title="六边形" onclick="setNodeShape('${id}','hexagon'); closeCtxMenu()">⬡</span>
    </div>
    <div class="context-sep"></div>
    <div class="context-item" onclick="duplicateNode('${id}'); closeCtxMenu()">📋 复制节点</div>
    <div class="context-sep"></div>
    <div class="context-item danger" onclick="deleteNode('${id}'); closeCtxMenu()">🗑 删除节点</div>
  `;
  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.classList.add('visible');
});

function closeCtxMenu() {
  document.getElementById('ctxMenu').classList.remove('visible');
}

// 右键菜单跳转：跳转到节点设置的链接页面（与双击跳转逻辑一致）
function jumpToLinkTab(id) {
  const tab = getTab();
  const node = tab.nodes.find(n => n.id === id);
  if (!node || !node.linkTab) return;
  const linkTab = state.tabs.find(t => t.id === node.linkTab);
  if (linkTab) {
    switchTab(linkTab.id);
    showToast('已跳转至「' + linkTab.label + '」');
  } else {
    showToast('目标页面不存在，请检查跳转设置');
  }
}
document.addEventListener('click', (e) => {
  const menu = document.getElementById('ctxMenu');
  if (!menu.contains(e.target)) closeCtxMenu();
});

function duplicateNode(id) {
  const tab = getTab();
  const node = tab.nodes.find(n => n.id === id);
  if (!node) return;
  pushUndo();
  const newId = 'n' + (state.nextId++);
  tab.nodes.push({ ...node, id: newId, x: node.x + 30, y: node.y + 30, sys: Array.isArray(node.sys) ? [...node.sys] : node.sys });
  state.selectedId = newId;
  state.selectedType = 'node';
  render();
  showToast('节点已复制');
}

// ============================================================
// Utils
// ============================================================
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 2000);
}
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ============================================================
// Start
// ============================================================
init();
</script>
