<!DOCTYPE html>
<!--
  ============================================================================
  空白模板 · Blank Flow Diagram Template
  一个零依赖、单文件的 SVG 可编辑流程图 / 架构图 / 数据流图编辑器。

  协议：MIT（可自由使用、修改、分发；保留本声明即可）
  版本：v1.0   ·   单文件、离线可用、无外部依赖、无网络请求

  【两种使用方式】
  方式一 · 提示词：让 AI 按 JSON 契约生成数据，再用本页右上角「导入 JSON」
                   载入 —— 立刻渲染成一张可继续编辑的图。
                   JSON 结构见同目录《空白模板_JSON结构与Prompt模板.md》。
  方式二 · skill ：使用配套 skill，由它自动走完
                   「生成 JSON → 导入本模板」整套流程，无需手工拼数据。

  【能力】多页签 / 区域分组 / 节点四种形状 / 连线三种样式（曲线·直线·折线）
          / 阶段线 / 拖拽编辑 / 右键菜单 / 6 套主题 / JSON 导入导出
          / PNG·GIF 导出 / 本地自动保存。

  【数据契约】画布 viewBox 1200×560，x/y 为元素左上角坐标。
          节点   {id,x,y,w,h,name,sys[],color,fill,borderStyle,zone,shape,linkTab}
          区域   {id,x,y,w,h,label,color,fill,borderStyle}
          连线   {id,from,to,color,fs,ts,style,curve,note}
          阶段线 {id,y,label}
          配色   emerald blue amber purple cyan pink red slate lime teal sky
                 indigo violet fuchsia rose orange yellow | "none" | "#RRGGBB"
          形状   rect | circle | rhombus | hexagon   边框 solid | dashed | none
          连线样式 curve | line | poly   锚点 top | bottom | left | right
  ============================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空白模板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-deep: #eef2f7;
    --bg-panel: #ffffff;
    --bg-card: #ffffff;
    --bg-input: #ffffff;
    --border: rgba(15,23,42,0.10);
    --border-hi: rgba(15,23,42,0.20);
    --text: #0f172a;
    --text-dim: #475569;
    --text-faint: #94a3b8;
    --emerald: #16a34a;
    --blue: #2563eb;
    --amber: #d97706;
    --purple: #9333ea;
    --cyan: #0891b2;
    --pink: #db2777;
    --red: #dc2626;
  }
  body {
    font-family: 'PingFang SC','Microsoft YaHei',-apple-system,sans-serif;
    background:
      radial-gradient(1200px 600px at 82% -12%, rgba(34,197,94,0.06), transparent 60%),
      radial-gradient(1000px 520px at -5% 112%, rgba(59,130,246,0.07), transparent 55%),
      linear-gradient(180deg, #f5f8fc 0%, #eaf0f6 100%);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== Top Bar ===== */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
    flex-shrink: 0;
    gap: 12px;
    flex-wrap: wrap;
  }
  .topbar h1 {
    font-size: 15px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--emerald), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    /* 标题被清空后仍保留可点击区域，否则 0 高度无法双击重新编辑 */
    min-height: 22px;
    min-width: 120px;
    display: inline-flex;
    align-items: center;
    cursor: text;
  }
  /* 空标题：去掉渐变文字裁剪并改用浅色占位，保留编辑入口的可见性与可点击性 */
  .topbar h1:empty {
    background: none;
    -webkit-text-fill-color: var(--text-faint);
    color: var(--text-faint);
  }
  .topbar h1:empty::before {
    content: "双击编辑标题";
    font-weight: 400;
  }
  .topbar-sub { font-size: 11px; color: var(--text-faint); margin-top: 1px; }
  .topbar-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  /* 画布整体缩放控件 */
  .zoom-group { display: flex; align-items: center; gap: 2px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 7px; padding: 2px 4px; }
  .zoom-group .btn-icon { min-width: 26px; padding: 4px 6px; font-size: 15px; line-height: 1; border: none; background: transparent; }
  .zoom-group .btn-icon:hover { background: rgba(15,23,42,0.06); }
  .zoom-label { min-width: 46px; text-align: center; font-size: 12px; color: var(--text); cursor: pointer; user-select: none; font-variant-numeric: tabular-nums; }
  .zoom-label:hover { color: var(--emerald); }

  /* ===== Buttons ===== */
  .btn {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-card);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--border-hi); background: rgba(15,23,42,0.05); }
  .btn-primary { border-color: var(--emerald); color: var(--emerald); }
  .btn-primary:hover { background: rgba(34,197,94,0.1); }
  .btn-danger { border-color: rgba(239,68,68,0.4); color: var(--red); }
  .btn-danger:hover { background: rgba(239,68,68,0.1); }
  .btn-toggle.active { border-color: var(--emerald); color: var(--emerald); background: rgba(34,197,94,0.08); }
  .save-status { font-size: 11px; color: var(--text-faint); margin-right: 2px; transition: color 0.2s; white-space: nowrap; }
  .save-status.dirty { color: var(--amber); }
  .save-status.saved { color: var(--emerald); }
  .save-status.err { color: var(--red); }
  .btn-tab {
    border-color: transparent;
    background: transparent;
    color: var(--text-dim);
    border-radius: 8px;
    padding: 6px 14px;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    line-height: 1.2;
  }
  .btn-tab:hover { color: var(--text); background: rgba(15,23,42,0.05); }
  .btn-tab.active {
    background: linear-gradient(135deg, rgba(34,197,94,0.15), rgba(6,182,212,0.1));
    border-color: var(--emerald);
    color: var(--emerald);
    box-shadow: 0 0 12px rgba(34,197,94,0.12);
  }
  .btn-tab.dragging { opacity: 0.45; border-style: dashed; }
  .btn-tab.drag-over { border-color: var(--emerald); box-shadow: 0 0 10px rgba(34,197,94,0.35); }
  /* 新增标签页按钮 */
  .btn-tab-add {
    flex-direction: row;
    justify-content: center;
    min-width: 34px;
    font-size: 18px;
    font-weight: 600;
    color: var(--emerald);
    align-self: center;
  }
  .btn-tab-add:hover { background: rgba(34,197,94,0.1); color: var(--emerald); border-color: var(--emerald); }

  /* ===== Tab Bar ===== */
  .tab-bar {
    display: flex;
    gap: 6px;
    padding: 10px 20px;
    background: rgba(255,255,255,0.65);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    overflow-x: auto;
  }

  /* ===== Main Layout ===== */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  /* ===== Canvas Area ===== */
  .canvas-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg-deep);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(34,197,94,0.03) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(59,130,246,0.03) 0%, transparent 50%);
  }
  /* 画布滚动容器：内容超高/超宽时出现滚动条，备注与连线提示框固定在视口内不随滚动 */
  .canvas-scroll {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    overflow: auto;
    z-index: 0;
  }
  .canvas-area svg { width: 100%; height: auto; min-height: 100%; display: block; overflow: visible; }

  /* ===== Tab note tooltip (鼠标停留 tab 时浮出备注，平时不显示、不占空间) ===== */
  .tab-note {
    position: fixed;
    z-index: 500;
    max-width: 240px;
    padding: 6px 10px;
    font-size: 11px;
    line-height: 1.45;
    color: var(--text-dim);
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 7px;
    box-shadow: 0 10px 30px rgba(15,23,42,0.18);
    white-space: normal;
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease;
  }
  .tab-note.show { opacity: 1; pointer-events: auto; }
  .btn-tab.active .tab-note { color: var(--emerald); }

  /* ===== Side Panel ===== */
  .side-panel {
    width: 300px;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
    transition: width 0.25s ease;
  }
  .side-panel.collapsed {
    width: 0;
    border-left: none;
    overflow: hidden;
  }

  /* ===== Panel toggle (collapse / expand) ===== */
  .panel-toggle {
    position: absolute;
    top: 12px;
    right: 300px;
    width: 22px;
    height: 30px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-right: none;
    border-radius: 8px 0 0 8px;
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    z-index: 60;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: right 0.25s ease, color 0.2s, background 0.2s;
    padding: 0;
  }
  .panel-toggle:hover { color: var(--emerald); background: var(--bg-card); }
  .panel-toggle.collapsed {
    right: 0;
    border-radius: 0 8px 8px 0;
    border-right: 1px solid var(--border);
    border-left: none;
  }
  .panel-section { padding: 16px; border-bottom: 1px solid var(--border); }
  .panel-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .form-group { margin-bottom: 12px; }
  .form-label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .form-input, .form-select {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus, .form-select:focus { border-color: var(--emerald); }
  .form-select { cursor: pointer; }
  .form-hint { font-size: 11px; color: var(--text-faint); margin-top: 3px; }

  .color-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .color-swatch {
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    border: 2px solid transparent; transition: all 0.2s;
  }
  .color-swatch:hover { transform: scale(1.12); }
  .color-swatch.selected { border-color: #0f172a; box-shadow: 0 0 8px rgba(15,23,42,0.22); }
  /* “无颜色”色块：白底 + 红色斜杠（常用一排末位） */
  .color-swatch-none {
    background:
      linear-gradient(135deg, transparent 44%, #EF4444 44%, #EF4444 56%, transparent 56%),
      linear-gradient(#ffffff, #ffffff);
    border: 1px solid var(--border-hi);
  }

  /* ===== 颜色盘（常用一排 + 最近使用 + 取色盘） ===== */
  .color-picker { display: flex; flex-direction: column; gap: 8px; }
  .color-row.common-row { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .color-custom-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .color-picker-btn {
    width: 30px; height: 30px; flex: 0 0 auto; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg-input); color: var(--text-dim); cursor: pointer;
  }
  .color-picker-btn:hover { border-color: var(--emerald); color: var(--emerald); }
  .color-native-hidden { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }

  /* 系统标识多选 chips */
  .sys-chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .sys-chip {
    padding: 3px 11px;
    font-size: 11px;
    border-radius: 12px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    background: transparent;
    transition: all 0.15s;
  }
  .sys-chip:hover { border-color: var(--emerald); color: var(--text); }
  .sys-chip.on {
    background: rgba(34,197,94,0.16);
    border-color: var(--emerald);
    color: var(--emerald);
    font-weight: 600;
  }
  /* 系统标识：已选 chip 带删除按钮，双击文字改名 */
  .sys-chip.on { display: inline-flex; align-items: center; gap: 5px; padding-right: 5px; }
  .sys-chip-text { cursor: text; }
  .sys-chip-x {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%;
    font-size: 12px; line-height: 1; opacity: 0.5;
    background: rgba(15,23,42,0.08);
  }
  .sys-chip-x:hover { opacity: 1; background: rgba(239,68,68,0.18); color: #EF4444; }
  .sys-empty { font-size: 11px; color: var(--text-faint); padding: 2px 0; }
  .sys-add-row { display: flex; gap: 6px; margin-top: 8px; }
  .sys-add-row .form-input { flex: 1; min-width: 0; }

  /* ===== One-click zone arrangement button ===== */
  .arrange-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 8px 0;
    font-size: 13px;
    background: rgba(34,197,94,0.12);
    border: 1px solid rgba(34,197,94,0.45);
    border-radius: 7px;
    color: var(--emerald);
    cursor: pointer;
    transition: all 0.15s;
  }
  .arrange-btn:hover { background: rgba(34,197,94,0.22); border-color: var(--emerald); }
  .arrange-btn:active { transform: scale(0.98); }

  /* ===== Mode banner ===== */
  .mode-banner {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(168,85,247,0.15);
    border: 1px solid var(--purple);
    border-radius: 8px;
    padding: 8px 20px;
    font-size: 13px;
    color: var(--purple);
    z-index: 50;
    display: none;
    white-space: nowrap;
  }
  .mode-banner.visible { display: block; }

  /* ===== SVG node styles ===== */
  .svg-node-rect {
    fill: var(--bg-card);
    stroke-width: 1.5;
    cursor: move;
    pointer-events: all;
    transition: filter 0.15s;
  }
  .svg-node-rect:hover { filter: brightness(1.18); }
  .svg-node-rect.selected {
    stroke: var(--emerald) !important;
    stroke-width: 2 !important;
    stroke-dasharray: 5 3 !important;
    filter: drop-shadow(0 0 6px rgba(91,141,239,0.85));
  }
  /* 节点超链接角标：不拦截点击，穿透到节点本体；淡化处理——灰阶半透明底 + 浅灰描边 + 淡色小箭头 */
  .svg-node-group [data-type="node-link-badge"] {
    pointer-events: none;
    opacity: 0.8;
  }
  .svg-node-group [data-type="node-link-badge"] rect {
    fill: rgba(148, 163, 184, 0.16);
    stroke: rgba(148, 163, 184, 0.45);
    stroke-width: 1;
  }
  .svg-node-group [data-type="node-link-badge"] text {
    fill: #64748b;
    font-size: 8px;
    font-weight: 600;
  }
  .svg-node-text {
    fill: var(--text);
    font-size: 13px;
    font-weight: 500;
    text-anchor: middle;
    pointer-events: none;
    user-select: none;
  }
  .svg-node-tag {
    font-size: 9px;
    text-anchor: middle;
    pointer-events: none;
    user-select: none;
    font-weight: 600;
  }
  /* 未选中节点：系统标识不高亮（弱化显示，仍展示全部） */
  .svg-node-tag.dim { fill: var(--text-faint); font-weight: 400; }
  .svg-flow-hit {
    fill: none;
    stroke: transparent;
    stroke-width: 14;
    cursor: pointer;
    pointer-events: stroke;
  }
  .svg-flow-hit.selected { stroke: rgba(15,23,42,0.18); }
  .svg-flow-path {
    fill: none;
    stroke-width: 2;
    stroke-dasharray: 6 4;
    animation: dashFlow 1.2s linear infinite;
    cursor: pointer;
    pointer-events: none;
    transition: stroke-width 0.2s;
  }
  .svg-flow-hit:hover + .svg-flow-path { stroke-width: 3; }
  .svg-node-anchor {
    /* 仅选中节点时渲染锚点（renderAnchors 只画选中节点的），因此默认可见 */
    opacity: 1;
    pointer-events: all;
    cursor: crosshair;
    stroke: rgba(15,23,42,0.45);
    stroke-width: 1.5;
    transition: r 0.15s;
  }
  .svg-node-anchor:hover { r: 7; }
  /* 阶段线（水平虚线）：命中区加宽便于拖动，视觉线虚线 */
  .svg-hline-hit {
    stroke: transparent;
    stroke-width: 16;
    cursor: ns-resize;
    pointer-events: all;
  }
  .svg-hline-hit:hover ~ .svg-hline-vis { stroke-opacity: 0.95; stroke-width: 2.5; }
  .svg-hline-vis {
    stroke-width: 2;
    stroke-dasharray: 10 8;
    pointer-events: none;
    transition: stroke-opacity 0.15s, stroke-width 0.15s;
  }
  .svg-hline-vis.selected { stroke-opacity: 0.95; filter: drop-shadow(0 0 4px rgba(100,116,139,0.9)); }
  /* 阶段线穿过区域的部分淡化（选中时也保持淡化） */
  .svg-hline-vis.zone-dim.selected { stroke-opacity: 0.35; }
  .svg-hline-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    user-select: none;
    pointer-events: none;
  }
  /* 连线备注：纯文字直接压在连线上，颜色跟随连线，无背景 */
  .svg-flow-note {
    font-size: 11px;
    font-weight: 600;
    pointer-events: none;
    user-select: none;
  }
  .svg-flow-path.selected { stroke-width: 3.5; filter: drop-shadow(0 0 4px currentColor); }
  .svg-flow-path.no-anim { animation: none; }
  @keyframes dashFlow { to { stroke-dashoffset: -20; } }
  .svg-particle { pointer-events: none; }
  .svg-zone-rect {
    stroke-width: 1;
    cursor: pointer;
    pointer-events: all;
    transition: filter 0.15s;
  }
  .svg-zone-rect:hover { filter: brightness(1.06); }
  .svg-zone-rect.selected {
    stroke: var(--emerald) !important;
    stroke-width: 1.5 !important;
    stroke-dasharray: 6 3 !important;
    filter: drop-shadow(0 0 6px rgba(91,141,239,0.85));
  }
  /* 区域缩放控制点：选中区域时显示在四角 + 四边中点 */
  .svg-zone-handle {
    pointer-events: all;
    transition: filter 0.1s;
  }
  .svg-zone-handle:hover { filter: brightness(1.3); }
  /* 节点缩放控制点：选中节点时显示在四角 + 四边中点（逻辑同区域） */
  .svg-node-handle {
    pointer-events: all;
    transition: filter 0.1s;
  }
  .svg-node-handle:hover { filter: brightness(1.3); }
  .svg-zone-label {
    font-size: 14px;
    font-weight: 600;
    pointer-events: none;
    user-select: none;
    opacity: 0.85;
  }

  /* ===== Lists ===== */
  .node-list-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 6px; cursor: pointer;
    transition: background 0.15s; font-size: 12px;
  }
  .node-list-item:hover { background: rgba(15,23,42,0.05); }
  .node-list-item.active { background: rgba(34,197,94,0.08); }
  .node-list-item.related { background: rgba(34,197,94,0.10); border: 1px solid rgba(34,197,94,0.35); margin: -1px; }
  .node-list-item.dimmed { opacity: 0.35; }
  .node-list-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .node-list-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty-state { text-align: center; padding: 24px 12px; color: var(--text-faint); font-size: 12px; line-height: 1.8; }

  /* ===== Toast / Context Menu ===== */
  .toast {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: var(--bg-card);
    border: 1px solid var(--emerald);
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 13px;
    color: var(--emerald);
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
  }

// ============================================================
// 本地存储键（通用命名）与旧版 scm_* 键的一次性迁移

const SAVE_KEY_LEGACY   = 'scm_template_v1';
const THEME_KEY         = 'flowdiagram_theme';
const THEME_KEY_LEGACY  = 'scm_template_theme';
const RECENT_KEY        = 'flowdiagram_recent_colors';
const RECENT_KEY_LEGACY = 'scm_recent_colors';
function lsGetMigrated(key, legacyKey) {
  try {
    const v = localStorage.getItem(key);
    if (v !== null) return v;
    const old = localStorage.getItem(legacyKey);   // 首次迁移：搬到新键
    if (old !== null) { localStorage.setItem(key, old); return old; }
  } catch (e) {}
  return null;
}

// ============================================================
const THEMES = { 'memphis': 1, 'clay-soft': 1, 'dark-glass': 1, 'tech-blue': 1, 'emerald-night': 1 };
function applyTheme(name) {
  const body = document.body;
  const t = (name && THEMES[name]) ? name : '';
  if (t) body.setAttribute('data-theme', t);
  else body.removeAttribute('data-theme');
  // 显式记录选择（含空串=默认浅色），避免下次打开回落到默认主题
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}

  if (sel) sel.value = t;
}

function loadDemoIfRequested() {
  try {
    if (!/demo/i.test(location.search || '') && !/demo/i.test(location.hash || '')) return false;
    state.tabs = JSON.parse(JSON.stringify(DEMO_DATA.tabs));   // 深拷贝，避免示例被后续编辑污染
    state.appTitle = DEMO_DATA.appTitle;
    state.activeTab = state.tabs[0].id;
    return true;
  } catch (e) { return false; }
}

// ============================================================
// Init
// ============================================================
// 数据归一化：补 hlines 字段；系统标识兼容旧数据（字符串 → 数组）；节点跳转页默认无链接
function normalizeData(tabs) {
  (tabs || []).forEach(t => {
    t.hlines = t.hlines || [];
    (t.nodes || []).forEach(n => {
      if (!Array.isArray(n.sys)) n.sys = n.sys ? [String(n.sys)] : [];
      if (n.linkTab === undefined) n.linkTab = '';
    });
    (t.flows || []).forEach(f => {
      if (f.style === undefined) f.style = 'curve';
    });
  });
}

function init() {
  const restored = loadSaved();
  if (!restored) state.tabs = buildDefaultTabs();
  DEMO_MODE = loadDemoIfRequested();   // ?demo / #demo：载入内置示例（优先于本地存档）
  normalizeData(state.tabs);
  if (!state.activeTab) state.activeTab = state.tabs[0].id;
  state.selectedId = null;
  state.selectedType = null;
  state.selectedZones = [];
  state._autoSaveReady = false;   // suppress auto-save during initial render
  const appTitleEl = document.getElementById('appTitle');
  if (appTitleEl) {
    // 支持空标题（清空后保持空白）；浏览器标签空值时回落文件名由浏览器自行处理
    appTitleEl.textContent = state.appTitle || '';
    document.title = state.appTitle || '';
  }
  renderTabBar();
  render();
  // sync animation button with (possibly restored) state
  const btnAnim = document.getElementById('btnAnim');
  btnAnim.textContent = '动画 ' + (state.animationOn ? '开' : '关');
  btnAnim.classList.toggle('active', state.animationOn);
  // 演示态不开启自动保存，避免内置示例覆盖使用者本地已存的图
  state._autoSaveReady = !DEMO_MODE;
  updateSaveStatus(DEMO_MODE ? 'none' : (restored ? 'saved' : 'none'));
  if (DEMO_MODE) showToast('演示模式：内置示例，编辑不会保存到本地');
  // 恢复主题
  let savedTheme = ''; // 首次打开默认：浅色
  try {
    const t = lsGetMigrated(THEME_KEY, THEME_KEY_LEGACY);
    if (t !== null) savedTheme = t;
  } catch (e) {}
  applyTheme(savedTheme);
}

function getTab() {
  return state.tabs.find(t => t.id === state.activeTab) || state.tabs[0];
}

// ============================================================
// Render
// ============================================================
function renderTabBar() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = '';
  state.tabs.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-tab' + (t.id === state.activeTab ? ' active' : '');
    btn.setAttribute('data-tab-id', t.id);
    btn.textContent = t.label;
    // 备注不再常驻标题下方；改为鼠标停留 tab 时浮出（fixed 定位，避免被 tab-bar overflow 裁剪）
    if ((t.desc || '').trim()) {
      const note = document.createElement('span');
      note.className = 'tab-note';
      note.textContent = t.desc;
      btn.appendChild(note);
      // hover 组：鼠标从 tab 移到浮出备注时不消失（短暂延时，二者皆能保持显示）
      let hideTimer = null;
      const showNote = () => {
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
        const r = btn.getBoundingClientRect();
        const nw = note.offsetWidth || 200;
        let left = r.left + r.width / 2 - nw / 2;
        left = Math.max(8, Math.min(left, window.innerWidth - nw - 8));
        note.style.left = left + 'px';
        note.style.top = (r.bottom + 6) + 'px';
        note.classList.add('show');
      };
      const hideNote = () => { hideTimer = setTimeout(() => { note.classList.remove('show'); hideTimer = null; }, 160); };
      btn.addEventListener('mouseenter', showNote);
      btn.addEventListener('mouseleave', hideNote);
      note.addEventListener('mouseenter', showNote);
      note.addEventListener('mouseleave', hideNote);
      // 关键修复：单击备注不能冒泡到 btn.onclick -> switchTab -> renderTabBar，
      // 否则双击备注时第一次单击会重建 tab 栏、销毁 note，导致 dblclick 落空、无法编辑。
      note.addEventListener('click', (e) => { e.stopPropagation(); });
      note.addEventListener('dblclick', (e) => { e.stopPropagation(); editTab(t.id); });
    }
    btn.onclick = () => switchTab(t.id);
    btn.ondblclick = (e) => { e.stopPropagation(); editTab(t.id); };
    // 拖动排序
    btn.draggable = true;
    btn.ondragstart = (e) => { dragTabId = t.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', t.id); btn.classList.add('dragging'); };
    btn.ondragend = () => {
      dragTabId = null;
      bar.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('dragging', 'drag-over'));
    };
    btn.ondragover = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; btn.classList.add('drag-over'); };
    btn.ondragleave = () => btn.classList.remove('drag-over');
    btn.ondrop = (e) => { e.preventDefault(); e.stopPropagation(); btn.classList.remove('drag-over'); if (dragTabId && dragTabId !== t.id) moveTab(dragTabId, t.id); };
    bar.appendChild(btn);
  });
  // 末尾追加“新增标签页”按钮
  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-tab btn-tab-add';
  addBtn.textContent = '+';
  addBtn.title = '新增标签页';
  addBtn.onclick = () => addTab();
  bar.appendChild(addBtn);
}
let dragTabId = null;   // tab 拖动排序：当前拖动的 tab id
// 新增标签页：创建空白 tab 并切换过去，同时弹出命名弹窗
function addTab() {
  if (state.tabs.length >= 20) { showToast('标签页数量已达上限（20）'); return; }
  const id = 'tab' + (state.nextId++);
  state.tabs.push({ id, label: '新标签页', desc: '', nodes: [], flows: [], zones: [] });
  state.activeTab = id;
  state.selectedId = null; state.selectedType = null;
  state.selectedZones = [];
  state.connectMode = false; state.connectFrom = null;
  undoStack.length = 0; // 新页面撤销仅对当前页有效（撤销架构只还原画布内容，不处理 tab 结构）
  renderTabBar();
  render();
  markDirty();
  showToast('已新增标签页');
  editTab(id); // 立即弹出命名弹窗
}

function moveTab(fromId, toId) {
  const from = state.tabs.findIndex(t => t.id === fromId);
  const to = state.tabs.findIndex(t => t.id === toId);
  if (from < 0 || to < 0 || from === to) return;
  const [item] = state.tabs.splice(from, 1);
  state.tabs.splice(to, 0, item);
  renderTabBar();
  markDirty();
  showToast('标签页顺序已调整');
}
function editTab(tabId) {
  const tab = state.tabs.find(t => t.id === tabId);
  if (!tab) return;
  const existing = document.querySelector('.modal-mask');
  if (existing) existing.parentNode.removeChild(existing);

  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  const box = document.createElement('div');
  box.className = 'modal-box';
  const title = document.createElement('div');
  title.className = 'modal-title';
  title.textContent = '编辑标签页';
  box.appendChild(title);

  const f1 = document.createElement('div');
  f1.className = 'modal-field';
  const l1 = document.createElement('label');
  l1.className = 'modal-label';
  l1.textContent = '名称';
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'modal-input';
  input.value = tab.label;
  f1.appendChild(l1); f1.appendChild(input);
  box.appendChild(f1);

  const f2 = document.createElement('div');
  f2.className = 'modal-field';
  const l2 = document.createElement('label');
  l2.className = 'modal-label';
  l2.textContent = '备注';
  const ta = document.createElement('textarea');
  ta.className = 'modal-textarea';
  ta.value = tab.desc || '';
  f2.appendChild(l2); f2.appendChild(ta);
  box.appendChild(f2);

  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const cancel = document.createElement('button');
  cancel.className = 'modal-btn';
  cancel.textContent = '取消';
  const ok = document.createElement('button');
  ok.className = 'modal-btn primary';
  ok.textContent = '确认';
  actions.appendChild(cancel);
  actions.appendChild(ok);
  box.appendChild(actions);
  mask.appendChild(box);
  document.body.appendChild(mask);

  const close = () => { if (mask.parentNode) mask.parentNode.removeChild(mask); };
  const confirm = () => {
    pushUndo();
    tab.label = input.value || '标签';
    tab.desc = ta.value || '';
    close();
    renderTabBar();
    markDirty();
    render();
  };

  ok.addEventListener('click', confirm);
  cancel.addEventListener('click', close);
  mask.addEventListener('mousedown', (ev) => { if (ev.target === mask) close(); });
  box.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') { ev.preventDefault(); close(); }
  });
  input.focus();
  input.select();
}
function editAppTitle() {
  const el = document.getElementById('appTitle');
  // 合并编辑：同一个输入框同时写入页面内标题与浏览器标签标题；允许留空（清空标题）
  showRenameOverlay(null, el.textContent, (val) => {
    const v = (val || '').trim(); // 允许空标题：与“清空”语义一致
    state.appTitle = v;
    el.textContent = v;            // 空标题时 h1 显示“双击编辑标题”占位并仍可点击
    document.title = v;            // 浏览器标签标题同步：清空即空（与 clearAll 一致）
    markDirty();
  }, { title: '编辑标题' });
}

// ============================================================
// 编辑撤销（Ctrl+Z 撤回本次修改，单页内多步、上限 50）
// ============================================================
let undoStack = [];
function pushUndo() {
  const tab = getTab();
  const snap = JSON.stringify({ nodes: tab.nodes, flows: tab.flows, zones: tab.zones, hlines: tab.hlines, desc: tab.desc });
  const top = undoStack[undoStack.length - 1];
  if (top && top.tabId === state.activeTab && top.data === snap) return; // 同状态去重
  undoStack.push({ tabId: state.activeTab, data: snap });
  if (undoStack.length > 50) undoStack.shift();
}
function undo() {
  if (!undoStack.length) { showToast('没有可撤销的操作'); return; }
  const last = undoStack.pop();
  if (last.tabId !== state.activeTab) { showToast('请停留在当前页面再撤销'); return; }
  const tab = getTab();
  const s = JSON.parse(last.data);
  tab.nodes = s.nodes; tab.flows = s.flows; tab.zones = s.zones; tab.hlines = s.hlines; tab.desc = s.desc;
  render(); markDirty();
  showToast('已撤销');
}
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
    // 输入框/可编辑区域内用原生文字撤销，不触发整体撤销
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
    e.preventDefault(); undo();
  }
});
// 属性面板输入框/下拉框聚焦即记录一次撤销快照（一次编辑/选择 = 一个撤销单位）
document.addEventListener('focusin', (e) => {
  if (e.target && e.target.classList && (e.target.classList.contains('form-input') || e.target.classList.contains('form-select'))) pushUndo();
});

function switchTab(tabId) {
  state.activeTab = tabId;
  state.selectedId = null;
  state.selectedType = null;
  state.selectedZones = [];
  state.connectMode = false;
  state.connectFrom = null;
  document.getElementById('modeBanner').classList.remove('visible');
  document.getElementById('tempLine').style.display = 'none';
  undoStack.length = 0; // 切换页面后撤销仅对当前页有效
  renderTabBar();
  render();
}

function render() {
  const tab = getTab();
  renderZones(tab);
  renderFlows(tab);
  renderNodes(tab);
  renderAnchors(tab);
  renderHLines(tab);
  renderParticles(tab);
  renderSidePanel();
  updateCounts();
  fitViewBox();
  markDirty();
}

// 画布自适应：按内容边界动态扩展 viewBox 宽高（原点保持 0,0，最小 1200x560）。
// 宽度必须跟着内容走：早期版本把宽度写死 1200，导致 x>1200 的区域（如时序图最右侧泳道）
// 被裁到画布外，看不见也点不中。
function fitViewBox() {
  const tab = getTab();
  const svgEl = document.getElementById('mainSvg');
  if (!tab || !svgEl) return;
  let maxX = 0, maxY = 0;
  (tab.zones || []).forEach(z => { maxX = Math.max(maxX, z.x + z.w); maxY = Math.max(maxY, z.y + z.h); });
  (tab.nodes || []).forEach(n => { maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + n.h); });
  (tab.hlines || []).forEach(h => { maxY = Math.max(maxY, h.y + 24); });
  const vbW = Math.max(1200, Math.ceil(maxX + 80)); // 右侧留白，最小 1200
  const vbH = Math.max(560, Math.ceil(maxY + 80));  // 底部留白，最小 560
  const next = '0 0 ' + vbW + ' ' + vbH;
  if (svgEl.getAttribute('viewBox') !== next) svgEl.setAttribute('viewBox', next);
}

// 区域填充：优先用渐变；渐变 defs 缺失时回退为纯色半透明。
// 关键：绝不能返回无效的 url(#...) —— 无效 paint 会让区域"无填充"，
// 而默认 pointer-events: visiblePainted 下无填充 = 点不中（边框仍可见，极具迷惑性）。
function zoneFill(colorKey) {
  const hex = COLORS[colorKey] || (typeof colorKey === 'string' && /^#[0-9a-fA-F]{6}$/.test(colorKey) ? colorKey : null);
  if (!hex) return 'rgba(148,163,184,0.14)';
  if (COLORS[colorKey] && document.getElementById('zg-' + colorKey)) return 'url(#zg-' + colorKey + ')';
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',0.14)';
}
// 颜色统一解析：命名键 -> 对应十六进制；否则当作十六进制原值
function resolveColor(c) {
  if (!c) return '#22C55E';
  return COLORS[c] || c;
}
// 最近使用颜色（持久化到 localStorage）
let recentColors = (() => {
  try { return JSON.parse(lsGetMigrated(RECENT_KEY, RECENT_KEY_LEGACY) || '[]'); } catch (e) { return []; }
})();
function addRecentColor(c) {
  c = resolveColor(c);
  if (/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(c)) {
    if (c.length === 4) c = '#' + c.slice(1).split('').map(x => x + x).join('');
    c = c.toLowerCase();
  } else { return; }
  recentColors = recentColors.filter(x => x !== c);
  recentColors.unshift(c);
  if (recentColors.length > 7) recentColors = recentColors.slice(0, 7);
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(recentColors)); } catch (e) {}
}
// 颜色盘 HTML：常用一排 + 取色盘图标按钮 + 最近使用（最多 7 条）
function colorPickerHTML(kind, id, current, prop) {
  prop = prop || 'color';
  const common = COMMON_COLORS.map(name => {
    if (name === 'none') {
      return `<div class="color-swatch color-swatch-none ${current === 'none' ? 'selected' : ''}" title="无颜色" onclick="applyColor('${kind}','${id}','none','${prop}')"></div>`;
    }
    return `<div class="color-swatch ${current === name ? 'selected' : ''}" style="background:${COLORS[name]}" title="${name}" onclick="applyColor('${kind}','${id}','${name}','${prop}')"></div>`;
  }).join('');
  const recent = recentColors.slice(0, 7).map(c =>
    `<div class="color-swatch" style="background:${c}" title="${c}" onclick="applyColor('${kind}','${id}','${c}','${prop}')"></div>`
  ).join('');
  const hex = resolveColor(current);
  return `<div class="color-picker">
    <div class="color-row common-row">${common}</div>
    <div class="color-custom-row">
      <button type="button" class="color-picker-btn" title="打开颜色盘" onclick="document.getElementById('cp_${kind}_${id}_${prop}').click()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.555C21.965 6.012 17.461 2 12 2z"/></svg>
      </button>
      ${recent}
      <input type="color" class="color-native-hidden" id="cp_${kind}_${id}_${prop}" value="${hex}" onchange="applyColor('${kind}','${id}', this.value, '${prop}')">
    </div>
  </div>`;
}
function applyColor(kind, id, value, prop) {
  value = (value || '').trim();
  if (!value) return;
  let stored = value;
  if (/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(value)) {
    stored = value.toLowerCase();
    if (stored.length === 4) stored = '#' + stored.slice(1).split('').map(x => x + x).join('');
  } else if (COLORS[value]) {
    stored = value;
  }
  const tab = getTab();
  if (kind === 'node') {
    const n = (tab.nodes || []).find(x => x.id === id);
    if (n) { pushUndo(); if (prop === 'fill') n.fill = stored; else n.color = stored; render(); }
  } else if (kind === 'zone') {
    const z = (tab.zones || []).find(x => x.id === id);
    if (z) { pushUndo(); if (prop === 'fill') z.fill = stored; else z.color = stored; render(); }
  } else if (kind === 'flow') {
    const f = (tab.flows || []).find(x => x.id === id);
    if (f) { pushUndo(); f.color = stored; render(); }
  }
  addRecentColor(stored);
}

function renderZones(tab) {
  const layer = document.getElementById('zonesLayer');
  layer.innerHTML = '';
  (tab.zones || []).forEach(z => {
    const sel = (state.selectedId === z.id && state.selectedType === 'zone') || (state.selectedZones||[]).includes(z.id);
    const border = z.borderStyle || 'solid';
    const fillNone = z.fill === 'none';
    const fillKey = fillNone ? null : (z.fill || z.color || 'emerald');
    const fillVal = fillNone ? 'none' : zoneFill(fillKey);
    const borderColor = resolveColor(z.color || 'emerald');
    // 边框色为“无颜色”时，区域标题仍需可读，回退中性灰
    const labelColor = (z.color === 'none') ? '#64748b' : borderColor;
    // 边框样式：实线=无虚线；虚线=6 3；无边框=不画（选中时仍显示高亮轮廓）
    let strokeDash = border === 'dashed' ? '6 3' : (sel ? '6 3' : 'none');
    let strokeOpacity = (border === 'none' && !sel) ? 0 : (sel ? 1 : 0.25);
    const rect = createSvgEl('rect', {
      x: z.x, y: z.y, width: z.w, height: z.h, rx: 14,
      class: 'svg-zone-rect' + (sel ? ' selected' : ''),
      fill: fillVal,
      stroke: borderColor,
      'stroke-opacity': strokeOpacity,
      'stroke-width': sel ? 1.5 : 1,
      'stroke-dasharray': strokeDash,
      'data-id': z.id, 'data-type': 'zone'
    });
    layer.appendChild(rect);
    const label = createSvgEl('text', {
      x: z.x + z.w/2, y: z.y + 22, class: 'svg-zone-label',
      fill: labelColor, 'text-anchor': 'middle',
      'data-id': z.id, 'data-type': 'zone-label'
    });
    label.textContent = z.label;
    layer.appendChild(label);
    zoneResizeHandles(z, layer);
  });
}

// 区域缩放控制点：仅选中区域显示，8 个（四角 nw/ne/sw/se + 四边中点 n/s/w/e）
function zoneResizeHandles(z, layer) {
  if (state.selectedId !== z.id || state.selectedType !== 'zone' || (state.selectedZones||[]).length > 1) return;
  const col = resolveColor(z.color);
  const hs = 6;
  const defs = {
    nw: [z.x, z.y, 'nwse-resize'], ne: [z.x + z.w, z.y, 'nesw-resize'],
    sw: [z.x, z.y + z.h, 'nesw-resize'], se: [z.x + z.w, z.y + z.h, 'nwse-resize'],
    n: [z.x + z.w/2, z.y, 'ns-resize'], s: [z.x + z.w/2, z.y + z.h, 'ns-resize'],
    w: [z.x, z.y + z.h/2, 'ew-resize'], e: [z.x + z.w, z.y + z.h/2, 'ew-resize']
  };
  for (const [side, [hx, hy, cur]] of Object.entries(defs)) {
    layer.appendChild(createSvgEl('rect', {
      x: hx - hs, y: hy - hs, width: hs * 2, height: hs * 2, rx: 2,
      fill: col, stroke: 'rgba(15,23,42,0.35)', 'stroke-width': 1.5,
      style: 'cursor:' + cur,
      class: 'svg-zone-handle',
      'data-id': z.id, 'data-type': 'zone-resize', 'data-side': side
    }));
  }
}
// 缩放拖动中轻量同步控制点位置（不重建画布）
function syncZoneHandles(z) {
  const hs = 6;
  const defs = {
    nw: [z.x, z.y], ne: [z.x + z.w, z.y],
    sw: [z.x, z.y + z.h], se: [z.x + z.w, z.y + z.h],
    n: [z.x + z.w/2, z.y], s: [z.x + z.w/2, z.y + z.h],
    w: [z.x, z.y + z.h/2], e: [z.x + z.w, z.y + z.h/2]
  };
  for (const [side, [hx, hy]] of Object.entries(defs)) {
    const r = document.querySelector(`rect[data-id="${z.id}"][data-type="zone-resize"][data-side="${side}"]`);
    if (r) { r.setAttribute('x', hx - hs); r.setAttribute('y', hy - hs); }
  }
}
// 区域缩放几何计算：按控制点方向返回新的 x/y/w/h（带最小尺寸限制，西/北边可反向拉动）
function zoneResizeGeom(zone, side, dx, dy, start) {
  const MIN_W = 40, MIN_H = 30;
  let nx = zone.x, ny = zone.y, nw = zone.w, nh = zone.h;
  if (side.includes('e')) nw = Math.max(MIN_W, start.ow + dx);
  if (side.includes('w')) {
    nx = Math.min(start.ox + start.ow - MIN_W, start.ox + dx);
    nw = start.ow + (start.ox - nx);
  }
  if (side.includes('s')) nh = Math.max(MIN_H, start.oh + dy);
  if (side.includes('n')) {
    ny = Math.min(start.oy + start.oh - MIN_H, start.oy + dy);
    nh = start.oh + (start.oy - ny);
  }
  return { x: Math.round(nx), y: Math.round(ny), w: Math.round(nw), h: Math.round(nh) };
}
// 节点缩放几何计算：与区域同逻辑（按控制点方向返回新的 x/y/w/h，带最小尺寸限制，西/北边可反向拉动）
function nodeResizeGeom(node, side, dx, dy, start) {
  const MIN_W = 24, MIN_H = 18;
  let nx = node.x, ny = node.y, nw = node.w, nh = node.h;
  if (side.includes('e')) nw = Math.max(MIN_W, start.ow + dx);
  if (side.includes('w')) {
    nx = Math.min(start.ox + start.ow - MIN_W, start.ox + dx);
    nw = start.ow + (start.ox - nx);
  }
  if (side.includes('s')) nh = Math.max(MIN_H, start.oh + dy);
  if (side.includes('n')) {
    ny = Math.min(start.oy + start.oh - MIN_H, start.oy + dy);
    nh = start.oh + (start.oy - ny);
  }
  return { x: Math.round(nx), y: Math.round(ny), w: Math.round(nw), h: Math.round(nh) };
}
// 节点缩放控制点：仅选中节点显示，4 个（仅四角 nw/ne/sw/se，去除四边中点）
function nodeResizeHandles(n, layer) {
  if (state.selectedId !== n.id || state.selectedType !== 'node') return;
  const col = resolveColor(n.color);
  const hs = 6;
  const defs = {
    nw: [n.x, n.y, 'nwse-resize'], ne: [n.x + n.w, n.y, 'nesw-resize'],
    sw: [n.x, n.y + n.h, 'nesw-resize'], se: [n.x + n.w, n.y + n.h, 'nwse-resize']
  };
  for (const [side, [hx, hy, cur]] of Object.entries(defs)) {
    layer.appendChild(createSvgEl('rect', {
      x: hx - hs, y: hy - hs, width: hs * 2, height: hs * 2, rx: 2,
      fill: col, stroke: 'rgba(15,23,42,0.35)', 'stroke-width': 1.5,
      style: 'cursor:' + cur,
      class: 'svg-node-handle',
      'data-id': n.id, 'data-type': 'node-resize', 'data-side': side
    }));
  }
}
// 缩放拖动中轻量同步节点控制点位置（不重建画布），逻辑同 syncZoneHandles
function syncNodeHandles(n) {
  const hs = 6;
  const defs = {
    nw: [n.x, n.y], ne: [n.x + n.w, n.y],
    sw: [n.x, n.y + n.h], se: [n.x + n.w, n.y + n.h],
    n: [n.x + n.w/2, n.y], s: [n.x + n.w/2, n.y + n.h],
    w: [n.x, n.y + n.h/2], e: [n.x + n.w, n.y + n.h/2]
  };
  for (const [side, [hx, hy]] of Object.entries(defs)) {
    const r = document.querySelector(`rect[data-id="${n.id}"][data-type="node-resize"][data-side="${side}"]`);
    if (r) { r.setAttribute('x', hx - hs); r.setAttribute('y', hy - hs); }
  }
}

// 节点形状：根据 n.shape 返回 SVG 元素类型与几何属性
// rect=矩形(默认) / rhombus=菱形·审批 / circle=圆形 / hexagon=六边形
function nodeShape(n) {
  const cx = n.x + n.w/2, cy = n.y + n.h/2;
  const s = n.shape || 'rect';
  if (s === 'rhombus') {
    return { tag: 'polygon', attrs: { points: `${cx},${n.y} ${n.x+n.w},${cy} ${cx},${n.y+n.h} ${n.x},${cy}` } };
  }
  if (s === 'circle') {
    return { tag: 'ellipse', attrs: { cx: cx, cy: cy, rx: n.w/2, ry: n.h/2 } };
  }
  if (s === 'hexagon') {
    return { tag: 'polygon', attrs: { points: nodeHexPts(n) } };
  }
  return { tag: 'rect', attrs: { x: n.x, y: n.y, width: n.w, height: n.h, rx: 10, ry: 10 } };
}
// 六边形顶点（上下边水平），渲染与连线端点共用
function nodeHexPts(n) {
  const cx = n.x + n.w/2, cy = n.y + n.h/2, qw = n.w * 0.25;
  return [n.x+qw, n.y, n.x+n.w-qw, n.y, n.x+n.w, cy, n.x+n.w-qw, n.y+n.h, n.x+qw, n.y+n.h, n.x, cy].join(' ');
}
// 节点文本纵向位置：0=名称(居中偏上)，1=系统标签(中心下方)
function nodeTextY(n, idx) {
  return idx === 0 ? n.y + n.h/2 - 4 : n.y + n.h/2 + 13;
}
function renderNodes(tab) {
  const layer = document.getElementById('nodesLayer');
  layer.innerHTML = '';
  (tab.nodes || []).forEach(n => {
    const g = createSvgEl('g', { 'data-id': n.id, class: 'svg-node-group' + (state.selectedId === n.id && state.selectedType === 'node' ? ' selected' : '') });
    const sel = state.selectedId === n.id && state.selectedType === 'node';
    const border = n.borderStyle || 'solid';
    const borderColor = resolveColor(n.color);
    const fillVal = n.fill ? resolveColor(n.fill) : null;
    let strokeDash = border === 'dashed' ? '5 3' : (sel ? '5 3' : 'none');
    let strokeOpacity = (border === 'none' && !sel) ? 0 : (sel ? 1 : 0.4);
    const sh = nodeShape(n);
    const shapeAttrs = Object.assign({}, sh.attrs, {
      class: 'svg-node-rect' + (sel ? ' selected' : ''),
      stroke: borderColor, 'stroke-opacity': strokeOpacity,
      'stroke-dasharray': strokeDash,
      'data-id': n.id, 'data-type': 'node', 'data-shape': n.shape || 'rect'
    });
    if (fillVal) shapeAttrs.fill = fillVal;
    const shapeEl = createSvgEl(sh.tag, shapeAttrs);
    g.appendChild(shapeEl);
    const text = createSvgEl('text', {
      x: n.x + n.w/2, y: nodeTextY(n, 0),
      class: 'svg-node-text', 'data-id': n.id, 'data-type': 'node-text'
    });
    text.textContent = n.name;
    g.appendChild(text);
    const tagAttrs = {
      x: n.x + n.w/2, y: nodeTextY(n, 1),
      class: 'svg-node-tag' + (sel ? '' : ' dim')
    };
    // 边框色为“无颜色”时，系统标识仍需可读，回退中性灰
    if (sel) tagAttrs.fill = (n.color === 'none') ? '#64748b' : borderColor;
    const tag = createSvgEl('text', tagAttrs);
    tag.textContent = formatSys(n.sys);
    g.appendChild(tag);
    // 超链接角标：节点设置了跳转页时右上角显示 ↗（pointer-events none 穿透到节点本体）
    if (n.linkTab) {
      const linkTab = state.tabs.find(t => t.id === n.linkTab);
      if (linkTab) {
        const badge = createSvgEl('g', { 'data-type': 'node-link-badge' });
        const tip = document.createElementNS('http://www.w3.org/2000/svg', 'title');
        tip.textContent = '双击跳转至：' + linkTab.label;
        badge.appendChild(tip);
        const brect = createSvgEl('rect', {
          x: n.x + n.w - 18, y: n.y + 2, width: 16, height: 12, rx: 3,
          fill: 'rgba(148,163,184,0.16)',
          stroke: 'rgba(148,163,184,0.45)',
          'stroke-width': 1
        });
        const btext = createSvgEl('text', {
          x: n.x + n.w - 10, y: n.y + 11,
          'text-anchor': 'middle', fill: '#64748b',
          'font-size': 8, 'font-weight': 600
        });
        btext.textContent = '↗';
        badge.appendChild(brect);
        badge.appendChild(btext);
        g.appendChild(badge);
      }
    }
    layer.appendChild(g);
    nodeResizeHandles(n, layer);
  });
}

// 系统标识显示：数组拼接显示，超长截断
function formatSys(sys) {
  const s = Array.isArray(sys) ? sys.join(' · ') : (sys || '');
  return s.length > 26 ? s.slice(0, 25) + '…' : s;
}

// 水平阶段虚线：贯穿整个可视画布宽度（超出 viewBox 延伸至容器左右边缘），用于区分流程阶段
// 命中区加宽可整条拖动（上下），双击改名，右键删除
// 层级：hlinesLayer 位于 zonesLayer 之前 → 阶段线在区域之下
function hlineRange() {
  const svgEl = document.getElementById('mainSvg');
  const canvas = svgEl ? svgEl.closest('.canvas-area') : null;
  const vbW = svgEl ? (parseFloat((svgEl.getAttribute('viewBox') || '0 0 1200 560').split(/\s+/)[2]) || 1200) : 1200;
  if (!svgEl || !canvas) return { x1: 0, x2: vbW };
  const sr = svgEl.getBoundingClientRect();
  const cr = canvas.getBoundingClientRect();
  const scale = sr.width / vbW || 1;
  return {
    x1: -(sr.left - cr.left) / scale,
    x2: vbW + (cr.right - sr.right) / scale
  };
}
// 阶段线分段：计算与 h.y 相交的所有区域 x 区间（合并重叠区间）
function hlineZoneIntervals(h, tab) {
  const ints = [];
  (tab.zones || []).forEach(z => {
    if (z.y <= h.y && h.y <= z.y + z.h) ints.push([z.x, z.x + z.w]);
  });
  if (!ints.length) return [];
  ints.sort((a, b) => a[0] - b[0]);
  const merged = [ints[0]];
  for (let i = 1; i < ints.length; i++) {
    const last = merged[merged.length - 1];
    if (ints[i][0] <= last[1]) last[1] = Math.max(last[1], ints[i][1]);
    else merged.push(ints[i]);
  }
  return merged;
}
// 将 [x1, x2] 按区域区间切成片段：dim=true 表示该段在区域内（淡化）
function hlineSegments(x1, x2, ints) {
  const segs = [];
  let cur = x1;
  ints.forEach(([a, b]) => {
    const aa = Math.max(a, cur), bb = Math.min(b, x2);
    if (aa > cur) segs.push([cur, aa, false]);
    if (bb >= aa) segs.push([aa, bb, true]);
    cur = Math.max(cur, bb);
  });
  if (cur < x2) segs.push([cur, x2, false]);
  return segs.length ? segs : [[x1, x2, false]];
}
function renderHLines(tab) {
  const layer = document.getElementById('hlinesLayer');
  layer.innerHTML = '';
  const rng = hlineRange();

    });
    layer.appendChild(hit);
    // 视觉线按区域分段：穿过区域的部分淡化（zone-dim），其余正常
    const ints = hlineZoneIntervals(h, tab);
    hlineSegments(rng.x1, rng.x2, ints).forEach(([a, b, dim]) => {
      const vis = createSvgEl('line', {
        x1: a, y1: h.y, x2: b, y2: h.y,

// 四向连线锚点独立图层（位于连线之上，避免被连线命中区遮挡点击）

function renderNodeAnchors(layer, n) {

// 连线路径：style='line' 直线 / 'poly' 折线(正交走线) / 其它 贝塞尔曲线（默认）
// curve: 曲线曲率倍率（默认 1），越大越弯
function computePath(from, to, fs, ts, style, curve) {
  const fcx = from.x + from.w/2, fcy = from.y + from.h/2;
  const tcx = to.x + to.w/2, tcy = to.y + to.h/2;
  const dx = tcx - fcx, dy = tcy - fcy;
  // 端点：连线指定了方向锚点(fs/ts)则从锚点出发/到达，否则按相对方向自动贴边
  const s = fs ? anchorPoint(from, fs) : nodeEdgePoint(from, fcx, fcy, dx, dy);
  const e = ts ? anchorPoint(to, ts) : nodeEdgePoint(to, tcx, tcy, -dx, -dy);
  if (style === 'line') return `M ${s.x},${s.y} L ${e.x},${e.y}`;
  if (style === 'poly') return polyPath(s, e, fs, ts);
  const mult = (typeof curve === 'number' && isFinite(curve)) ? curve : 1;
  const offset = (Math.min(Math.abs(dx), Math.abs(dy)) * 0.4 + 30) * mult;
  if (Math.abs(dx) > Math.abs(dy)) {
    return `M ${s.x},${s.y} C ${s.x+offset*Math.sign(dx)},${s.y} ${e.x-offset*Math.sign(dx)},${e.y} ${e.x},${e.y}`;
  } else {
    return `M ${s.x},${s.y} C ${s.x},${s.y+offset*Math.sign(dy)} ${e.x},${e.y-offset*Math.sign(dy)} ${e.x},${e.y}`;
  }
}
// 折线（正交走线）：根据起点/终点锚点方向做直角拐弯，未指定锚点时按主轴走线
function polyPath(s, e, fs, ts) {
  const mx = (s.x + e.x) / 2;
  const my = (s.y + e.y) / 2;
  const hSide = side => side === 'left' || side === 'right';
  const vSide = side => side === 'top' || side === 'bottom';
  if (fs && ts) {
    if (hSide(fs) && hSide(ts)) {
      // 两侧均水平出线 → 中间竖直折弯
      return `M ${s.x},${s.y} L ${mx},${s.y} L ${mx},${e.y} L ${e.x},${e.y}`;
    }
    if (vSide(fs) && vSide(ts)) {
      // 两侧均竖直出线 → 中间水平折弯
      return `M ${s.x},${s.y} L ${s.x},${my} L ${e.x},${my} L ${e.x},${e.y}`;
    }
    if (hSide(fs) && vSide(ts)) {
      // 水平出 → 竖直到：单折于 (e.x, s.y)
      return `M ${s.x},${s.y} L ${e.x},${s.y} L ${e.x},${e.y}`;
    }
    // 竖直出 → 水平到：单折于 (s.x, e.y)
    return `M ${s.x},${s.y} L ${s.x},${e.y} L ${e.x},${e.y}`;
  }
  // 自动方向：按主轴走直角
  if (Math.abs(e.x - s.x) >= Math.abs(e.y - s.y)) {
    return `M ${s.x},${s.y} L ${mx},${s.y} L ${mx},${e.y} L ${e.x},${e.y}`;
  }
  return `M ${s.x},${s.y} L ${s.x},${my} L ${e.x},${my} L ${e.x},${e.y}`;
}
// 节点四向锚点坐标：上/下/左/右 边中点
function anchorPoint(n, side) {
  const cx = n.x + n.w/2, cy = n.y + n.h/2;
  if (side === 'top') return { x: cx, y: n.y };
  if (side === 'bottom') return { x: cx, y: n.y + n.h };
  if (side === 'left') return { x: n.x, y: cy };
  return { x: n.x + n.w, y: cy };
}
// 从节点中心沿方向 (dx,dy) 到形状边界的交点（连线端点）
function nodeEdgePoint(n, cx, cy, dx, dy) {
  const s = n.shape || 'rect';
  if (s === 'circle') {
    const ang = Math.atan2(dy, dx);
    return { x: cx + (n.w/2) * Math.cos(ang), y: cy + (n.h/2) * Math.sin(ang) };
  }
  if (s === 'rhombus') {
    const rw = n.w/2, rh = n.h/2;
    const den = Math.abs(dx)/rw + Math.abs(dy)/rh;
    const t = den > 1e-9 ? 1/den : 0;
    return { x: cx + dx*t, y: cy + dy*t };
  }
  if (s === 'hexagon') {
    const pts = nodeHexPts(n).split(' ').map(Number);
    const poly = [];
    for (let i = 0; i < pts.length; i += 2) poly.push([pts[i], pts[i+1]]);
    const hit = rayPolygonIntersect(poly, cx, cy, dx, dy);
    return hit || { x: cx + dx, y: cy + dy };
  }
  if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? { x: n.x + n.w, y: cy } : { x: n.x, y: cy };
  return dy > 0 ? { x: cx, y: n.y + n.h } : { x: cx, y: n.y };
}
// 射线 (cx,cy)+t*(dx,dy), t>0 与凸多边形边界最近交点
function rayPolygonIntersect(poly, cx, cy, dx, dy) {
  let best = null;
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i+1) % poly.length];
    const sx = b[0]-a[0], sy = b[1]-a[1];
    const det = dx*sy - dy*sx;
    if (Math.abs(det) < 1e-9) continue;
    const t = ((a[0]-cx)*sy - (a[1]-cy)*sx) / det;
    const u = ((a[0]-cx)*dy - (a[1]-cy)*dx) / det;
    if (t > 0 && u >= 0 && u <= 1 && (!best || t < best.t)) best = { t, x: cx + t*dx, y: cy + t*dy };
  }
  return best ? { x: best.x, y: best.y } : null;
}

function createSvgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'textContent') el.textContent = v;
    else el.setAttribute(k, v);
  }
  return el;
}

function editFlowNote(id) {
  const tab = getTab();
  const f = (tab.flows || []).find(x => x.id === id);
  if (!f) return;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position: fixed; left: 50%; top: 42%; transform: translate(-50%,-50%); z-index: 300; background: var(--bg-input); border: 1px solid var(--emerald); border-radius: 8px; padding: 10px 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.5);';
  const ta = document.createElement('textarea');
  ta.value = f.note || '';
  ta.rows = 2;
  ta.placeholder = '输入备注（显示在连线中点上方）';
  ta.style.cssText = 'background: transparent; border: none; outline: none; color: var(--text); font-size: 13px; font-family: inherit; width: 260px; resize: none;';
  overlay.appendChild(ta);
  document.body.appendChild(overlay);
  ta.focus();
  ta.select();
  let cancelled = false;
  const save = () => {
    if (cancelled) return;
    const val = ta.value.trim();
    if (val !== (f.note || '')) {
      f.note = val || null;
      renderFlows(tab);
      renderParticles(tab);
      markDirty();
    }
    if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
  };
  ta.addEventListener('blur', save);
  ta.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); ta.blur(); }
    if (ev.key === 'Escape') { cancelled = true; overlay.remove(); }
  });
}

// ============================================================
// Actions
// ============================================================
function selectNode(id) {
  state.selectedId = id; state.selectedType = 'node'; render();
}
function selectFlow(id) {
  state.selectedId = id; state.selectedType = 'flow'; render();
}
function selectZone(id, evt) {
  const additive = evt && (evt.ctrlKey || evt.metaKey || evt.shiftKey);
  const sel = state.selectedZones || (state.selectedZones = []);
  if (additive) {
    const idx = sel.indexOf(id);
    if (idx >= 0) sel.splice(idx, 1); else sel.push(id);
    if (sel.length === 0) { state.selectedId = null; state.selectedType = null; }
    else { state.selectedId = id; state.selectedType = 'zone'; }
  } else {
    state.selectedZones = [id];
    state.selectedId = id; state.selectedType = 'zone';
  }
  render();
}
// 一键排列：当前页所有区域顶端对齐 + 横向等距分布（无需选中）
// 区域位置变化时，区域内子节点（node.zone === zone.id）同步移动同样的位移
function arrangeZones() {
  const tab = getTab();
  // 区域排列只允许对"已选中的多个区域"触发；未选足够数量直接提示返回
  const selSet = new Set(state.selectedZones || []);
  if (selSet.size < 2) { showToast('请先选中至少 2 个区域（Ctrl / Shift 多选区域）再进行排列'); return; }
  const zones = (tab.zones || []).filter(z => selSet.has(z.id));
  pushUndo();
  const top = Math.min(...zones.map(z => z.y));
  const before = zones.map(z => ({ id: z.id, x: z.x, y: z.y }));
  zones.forEach(z => z.y = Math.round(top));
  distributeZones(zones, 'h');
  moveZoneChildren(tab, zones, before);
  render();
  markDirty();
  showToast('已排列 ' + zones.length + ' 个区域（顶端对齐 + 横向分布，子节点已同步移动）');
}
// 根据区域位移（排列前后坐标差）同步移动区域内子节点
function moveZoneChildren(tab, zones, before) {
  const nodes = tab.nodes || [];
  for (const z of zones) {
    const o = before.find(b => b.id === z.id);
    if (!o) continue;
    const dx = z.x - o.x, dy = z.y - o.y;
    if (!dx && !dy) continue;
    for (const n of nodes) {
      if (n.zone === z.id) { n.x += dx; n.y += dy; }
    }
  }
}
function distributeZones(zs, axis) {
  const sorted = [...zs].sort((a, b) => axis === 'h' ? a.x - b.x : a.y - b.y);
  const total = axis === 'h'
    ? sorted[sorted.length - 1].x + sorted[sorted.length - 1].w - sorted[0].x
    : sorted[sorted.length - 1].y + sorted[sorted.length - 1].h - sorted[0].y;
  const sum = sorted.reduce((s, z) => s + (axis === 'h' ? z.w : z.h), 0);
  const gap = Math.max(0, (total - sum) / (sorted.length - 1));
  let cur = axis === 'h' ? sorted[0].x : sorted[0].y;
  for (const z of sorted) {
    if (axis === 'h') z.x = Math.round(cur); else z.y = Math.round(cur);
    cur += (axis === 'h' ? z.w : z.h) + gap;
  }
}
// ============================================================
// 区域内节点均匀分布
// ============================================================
// 核心：节点按 y 相近自动分组为"行"，水平方向严格约束在区域内。
// 水平方向：每行内节点在区域左右内边距（14px）之间等距铺满（间隙均分），
//           一行放不下时按区域宽度自动拆分为多个子行，绝不超出区域；
// 垂直方向：行与行之间依据区域内最高节点与最低节点均匀分布（最高行 y 不动、
//           最低行底边不动，中间行在两者之间均分），行内相对位置保留。
// 只改数据不渲染，返回实际分布的节点数（不足 2 个返回 0）。
function layoutZoneNodes(zone, tab) {
  const nodes = (tab.nodes || []).filter(n => n.zone === zone.id);
  if (nodes.length < 2) return 0;
  const pad = 14, gap = 24;
  // 1) 按 y 排序贪心分组为"行"（y 差 ≤24 视为同一行）
  const sorted = [...nodes].sort((a, b) => (a.y - b.y) || (a.x - b.x));
  const rows = [];
  for (const n of sorted) {
    const last = rows[rows.length - 1];
    if (last && n.y - last.y <= gap) last.nodes.push(n);
    else rows.push({ y: n.y, nodes: [n] });
  }
  // 2) 水平重排（行内等距铺满区域；一行放不下按区域宽度拆分子行；单节点行 x 不动）
  const out = [];
  for (const row of rows) {
    const ns = [...row.nodes].sort((a, b) => a.x - b.x);
    if (ns.length === 1) { out.push(row); continue; }
    const maxW = Math.max(...ns.map(n => n.w || 130));
    const maxH = Math.max(...ns.map(n => n.h || 50));
    const perRow = Math.max(1, Math.floor((zone.w - 2 * pad + gap) / (maxW + gap)));
    if (ns.length <= perRow) {
      // 一行放得下：行内等距铺满区域（首尾留 14px 边距），y 不变
      const wSum = ns.reduce((s, n) => s + (n.w || 130), 0);
      const g = Math.max(gap, (zone.w - 2 * pad - wSum) / (ns.length - 1));
      let cur = zone.x + pad;
      for (const n of ns) { n.x = Math.round(cur); cur += (n.w || 130) + g; }
      out.push(row);
    } else {
      // 一行放不下：按区域宽度拆分，每组 perRow 个排成子行（子行 y 顺延，行内 y 对齐子行顶）
      for (let i = 0; i < ns.length; i += perRow) {
        const gNodes = ns.slice(i, i + perRow);
        const rowY = row.y + (i / perRow) * (maxH + gap);
        if (gNodes.length === 1) {
          gNodes[0].x = Math.round(zone.x + (zone.w - (gNodes[0].w || 130)) / 2); // 单节点子行居中
        } else {
          const wSum = gNodes.reduce((s, n) => s + (n.w || 130), 0);
          const g = Math.max(gap, (zone.w - 2 * pad - wSum) / (gNodes.length - 1));
          let cur = zone.x + pad;
          for (const n of gNodes) { n.x = Math.round(cur); cur += (n.w || 130) + g; }
        }
        for (const n of gNodes) n.y = Math.round(rowY);
        out.push({ y: rowY, nodes: gNodes });
      }
    }
  }
  // 3) 行间垂直分布：最高行 y 不动、最低行底边不动，中间行在两者之间均分（行内相对 y 保留）
  if (out.length >= 2) {
    const rs = [...out].sort((a, b) => a.y - b.y);
    const topY = rs[0].y;
    const bottom = rs[rs.length - 1].y + Math.max(...rs[rs.length - 1].nodes.map(n => n.h || 50));
    const sumH = rs.reduce((s, r) => s + Math.max(...r.nodes.map(n => n.h || 50)), 0);
    const gapY = Math.max(12, (bottom - topY - sumH) / (rs.length - 1));
    let curY = topY;
    for (const r of rs) {
      const dy = curY - r.y;
      const rH = Math.max(...r.nodes.map(n => n.h || 50));
      for (const n of r.nodes) n.y = Math.round(n.y + dy);
      curY += rH + gapY;
    }
  }
  return nodes.length;
}
// 选中区域分布：区域属性面板按钮 + 区域右键菜单入口
function distributeZoneNodes(zoneId) {
  const tab = getTab();
  const zone = (tab.zones || []).find(z => z.id === zoneId);
  if (!zone) return;
  pushUndo();
  const n = layoutZoneNodes(zone, tab);
  if (n < 2) { showToast('该区域内节点不足 2 个'); return; }
  render(); markDirty();
  showToast('区域内 ' + n + ' 个节点已均匀分布');
}
// 本区域节点水平居中：每个节点在所属区域水平方向居中（保持各自 y），用于"一行 / 单列"对齐
function centerZoneNodesH(zoneId) {
  const tab = getTab();
  const zone = (tab.zones || []).find(z => z.id === zoneId);
  if (!zone) return;
  const nodes = (tab.nodes || []).filter(n => n.zone === zoneId);
  if (nodes.length === 0) { showToast('该区域内没有节点'); return; }
  pushUndo();
  nodes.forEach(n => { n.x = Math.round(zone.x + (zone.w - (n.w || 130)) / 2); });
  render(); markDirty();
  showToast('已将 ' + nodes.length + ' 个节点在本区域内水平居中');
}
// 本区域节点垂直居中：每个节点在所属区域垂直方向居中（保持各自 x），用于"一列"对齐
function centerZoneNodesV(zoneId) {
  const tab = getTab();
  const zone = (tab.zones || []).find(z => z.id === zoneId);
  if (!zone) return;
  const nodes = (tab.nodes || []).filter(n => n.zone === zoneId);
  if (nodes.length === 0) { showToast('该区域内没有节点'); return; }
  pushUndo();
  nodes.forEach(n => { n.y = Math.round(zone.y + (zone.h - (n.h || 50)) / 2); });
  render(); markDirty();
  showToast('已将 ' + nodes.length + ' 个节点在本区域内垂直居中');
}
function updateNodeProp(id, prop, val) {
  const tab = getTab();
  const n = (tab.nodes || []).find(x => x.id === id);
  if (!n) return;
  n[prop] = typeof n[prop] === 'number' ? (parseInt(val)||0) : val;
  // 区域归属/形状/跳转页/边框样式 为一次性下拉操作，全量刷新；其余属性轻量更新画布，避免重建面板导致输入框失焦
  if (prop === 'zone' || prop === 'shape' || prop === 'linkTab' || prop === 'borderStyle') { render(); return; }
  syncNodeSvg(n);
  renderFlows(tab);
  renderParticles(tab);
  updateCounts();
  markDirty();
}
function updateFlowProp(id, prop, val) {
  const tab = getTab();
  const f = (tab.flows || []).find(x => x.id === id);
  if (!f) return;
  if ((prop === 'from' || prop === 'to') && !val) return;
  f[prop] = val || null;
  if (prop === 'note') {

// ============================================================
// Local persistence (auto-save + manual save)
// ============================================================
// SAVE_KEY / THEME_KEY / RECENT_KEY 及旧键迁移见文件顶部常量区
const AUTO_SAVE_DELAY = 2500;   // 自动保存防抖：2.5s（避免频繁写入干扰编辑）
let saveTimer = null;
let dirtyWhileTyping = false;   // 输入框聚焦期间挂起自动保存

function isTextInputFocused() {
  const a = document.activeElement;
  return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA');
}

function markDirty() {
  if (!state._autoSaveReady) return;
  updateSaveStatus('editing');
  if (saveTimer) clearTimeout(saveTimer);
  // 正在输入文字时不自动保存，等焦点移出后再保存，避免打断输入
  if (isTextInputFocused()) { dirtyWhileTyping = true; return; }
  dirtyWhileTyping = false;
  saveTimer = setTimeout(doSave, AUTO_SAVE_DELAY);
}

// 输入框失焦后补一次保存计时
document.addEventListener('focusout', () => {
  if (dirtyWhileTyping) markDirty();
});

function doSave() {
  saveTimer = null;
  if (DEMO_MODE) { updateSaveStatus('none'); return; }  // 演示态不落盘，保护使用者本地数据
  try {
    const payload = {
      v: 2,
      savedAt: Date.now(),
      appTitle: state.appTitle,
      activeTab: state.activeTab,
      nextId: state.nextId,
      animationOn: state.animationOn,
      tabs: state.tabs.map(t => ({
        id: t.id, label: t.label, desc: t.desc,
        nodes: t.nodes, flows: t.flows, zones: t.zones, hlines: t.hlines || []
      }))
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(payload));
    updateSaveStatus('saved');
  } catch (e) {
    updateSaveStatus('err');
  }
}

function saveNow() {
  if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
  doSave();
  showToast('已保存到本地（刷新后保留）');
}

function loadSaved() {
  try {
    const raw = lsGetMigrated(SAVE_KEY, SAVE_KEY_LEGACY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    // 版本不匹配（旧版 5 标签页数据）→ 清除并回退到默认 13 页
    if (!data || data.v !== 2) {
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
      return false;
    }
    if (!Array.isArray(data.tabs) || data.tabs.length === 0) return false;
    state.tabs = data.tabs;
    if (typeof data.appTitle === 'string') state.appTitle = data.appTitle; // 保留空标题（清空后刷新仍是空白）
    state.activeTab = data.activeTab || data.tabs[0].id;
    if (typeof data.nextId === 'number') state.nextId = data.nextId;
    if (typeof data.animationOn === 'boolean') state.animationOn = data.animationOn;
    return true;
  } catch (e) {
    return false;
  }
}

function updateSaveStatus(s) {
  const el = document.getElementById('saveStatus');
  if (!el) return;
  if (s === 'editing') { el.textContent = '编辑中…'; el.className = 'save-status dirty'; }
  else if (s === 'saved') {
    const t = new Date();
    const hh = String(t.getHours()).padStart(2, '0');
    const mm = String(t.getMinutes()).padStart(2, '0');
    el.textContent = '已保存 ' + hh + ':' + mm;
    el.className = 'save-status saved';
  }
  else if (s === 'err') { el.textContent = '保存失败'; el.className = 'save-status err'; }
  else { el.textContent = '未保存'; el.className = 'save-status'; }
}

// Persist on tab close / refresh as a safety net
window.addEventListener('beforeunload', () => {
  if (state._autoSaveReady) { if (saveTimer) clearTimeout(saveTimer); doSave(); }
});

// ============================================================
// Export / Import
// ============================================================
function exportJSON() {
  closeExportMenu();
  const data = {
    version: 1,
    appTitle: state.appTitle,
    tabs: state.tabs.map(t => ({
      id: t.id, label: t.label, desc: t.desc,
      nodes: t.nodes, flows: t.flows, zones: t.zones, hlines: t.hlines || []
    }))
  };
  downloadFile('flow-diagram.json', JSON.stringify(data, null, 2));
  showToast('JSON 已导出（含所有标签页与阶段线）');
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data.tabs) && data.tabs.length > 0) {
        state.tabs = data.tabs;
        // 归一化：补 hlines 字段（兼容旧导出文件）、sys 转数组、flow.style 默认曲线
        normalizeData(state.tabs);
        if (typeof data.appTitle === 'string') {
          state.appTitle = data.appTitle;
          const _h = document.getElementById('appTitle');
          if (_h) _h.textContent = state.appTitle;
          document.title = state.appTitle || ''; // 允许空标题（与“清空”语义一致）
        }
      } else if (Array.isArray(data.nodes) || Array.isArray(data.flows) || Array.isArray(data.zones) || Array.isArray(data.hlines)) {
        // Legacy single-tab format：合入当前页签
        const tab = getTab();
        if (data.nodes) tab.nodes = data.nodes;
        if (data.flows) tab.flows = data.flows;
        if (data.zones) tab.zones = data.zones;
        if (Array.isArray(data.hlines)) tab.hlines = data.hlines;
        normalizeData([tab]);
      } else {
        showToast('导入失败：格式错误'); return;
      }
      state.selectedId = null; state.selectedType = null; state.selectedZones = [];
      // 导入会整份替换页签：原 activeTab 可能已不存在 → 回落到第一个页签
      if (!state.tabs.some(t => t.id === state.activeTab)) state.activeTab = state.tabs[0].id;
      renderTabBar();
      render();
      doSave();   // 立即落盘，避免刷新后回到导入前的旧数据
      showToast('JSON 已导入' + (state.tabs.some(t => (t.hlines || []).length) ? '（含阶段线）' : ''));
    } catch (err) {
      showToast('导入失败：格式错误');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function downloadFile(name, content, type = 'application/json') {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.click();
  URL.revokeObjectURL(url);
}

// ============================================================
// 导出：JSON / 图片(PNG) / 动图(GIF) 多格式
// ============================================================
function downloadBlob(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function toggleExportMenu(e) {

    });
